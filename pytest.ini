[pytest]
testpaths = tests
bdd_features_base_dir = features/
addopts = -p pytester
filterwarnings =
    error
    ignore::DeprecationWarning
    ignore::ImportWarning
markers =
    deprecated: mark test testing deprecated API
    deficient: mark test with non-full coverage
    surplus: mark test testing non-standard API
    e2e_convert_candidate: mark user-facing pytest tests targeted for e2e feature conversion
    e2e_retain_technical: mark technical regression tests that must remain in pytest suite
    e2e_deferred_conversion: mark tests intended for later conversion when blockers are removed
