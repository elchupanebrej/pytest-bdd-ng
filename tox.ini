[tox]
requires =
    tox>=4.2
env_list =
    typecheck
    py314-pre-commit-lin
    py314-ruff
    py314-doc-gen
    py{310,311}-pytestlatest-coverage-lin
    py{310,311}-pytestlatest-xdist-coverage-lin
    py310-pytest{70,71}-coverage-lin
    py311-pytest72-coverage-lin
    py312-pytest{73,74,80,81}-coverage-lin
    py312-pytestlatest-coverage-lin
    py312-pytestlatest-xdist-coverage-lin
    py313-pytest{82,83,84,90,latest}-coverage-{lin,mac,win}
    py313-pytestlatest-xdist-coverage-lin
    py313-pytest84-allure-coverage-{lin,mac,win}
    py314-pytest{84,90,latest}-coverage-{lin,mac,win}
    py314-pytestlatest-gherkin{33,latest}-xdist-coverage-lin
    py314-pytestlatest-gherkin{33,latest}-xdist-coverage-{mac,win}
    pypy311-pytest{90,latest}-coverage-{lin,mac,win}
    pypy311-pytestlatest-xdist-coverage-lin
    pypy310-pytestlatest-coverage-{lin,mac,win}
    py312-pytest{73,74,80,81}-coverage-{mac,win}
    py314-pytestlatest-playwright-report
    py313-live-formatters-acceptance-{lin,mac,win}
    py314-pytestlatest-xdist-remote-{socket,via,ssh}-{lin,win}
    native-go-parser
    py314-pytest90-mypy
    py314-pytestlatest-mypy
    py314-pytestlatest-mypy-messages
distshare = {homedir}/.tox/distshare

# Lane policy (#233): frozen Python x pytest "compat" lanes stay sequential -
# xdist can mask ordering assumptions in lanes that exist to freeze behavior.
# xdist lanes are not coverage-gated: raw `coverage run` does not measure xdist
# workers (#208), and the sequential twins already enforce fail_under on the
# same code.
[testenv]
description = pytest-cuke runtime lane
deps =
    .[struct-bdd]
    .[test]
    uv>=0.8
    allure: .[allure]
    coverage: coverage>=7.4
    pypy310: coverage<7.5
    pypy311: coverage<7.5
    gherkin33: gherkin-official>=33,<34
    gherkinlatest: gherkin-official
    pytest73: pytest~=7.3.0
    pytest74: pytest~=7.4.0
    pytest70: pytest~=7.0.0
    pytest71: pytest~=7.1.0
    pytest72: pytest~=7.2.0
    pytest80: pytest~=8.0.0
    pytest81: pytest~=8.1.0
    pytest82: pytest~=8.2.0
    pytest83: pytest~=8.3.0
    pytest84: pytest~=8.4.0
    pytest90: pytest~=9.0.0
    pytestlatest: pytest
    xdist: pytest-xdist<4
set_env =
    COLUMNS = 80
    coverage: _PYTEST_CMD = coverage run --append -m pytest
    xdist: _PYTEST_MORE_ARGS = -n4 -rfsxX
    win: _PYTEST_MORE_ARGS = -rfsxX
commands =
    {env:_PYTEST_CMD:python -m pytest} {env:_PYTEST_MORE_ARGS:} {posargs:-m "not e2e and not external and not typecheck and not doc_gen" -q}
platform =
    lin: linux
    mac: darwin
    win: win32

[testenv:py314-pytestlatest-playwright-report]
description = build and inspect a rendered Allure HTML report in Chromium
extras = test,allure,test-playwright,struct-bdd
deps =
    .[struct-bdd]
    gherkin-official
    pytest-xdist<4
commands =
    python -m playwright install --with-deps chromium
    python -m pytest --cuke-autoload --cuke-features-dir=features --alluredir=allure-results features/compatibility/browser-report.feature -m e2e -q

[testenv:py313-live-formatters-acceptance-{lin,mac,win}]
description = run live formatter and native Allure BDD acceptance
base_python = python3.13
deps =
    .[struct-bdd]
    .[test]
    uv>=0.8
commands =
    python -m pytest features/live-cucumber-progress-bar.feature features/live-cucumber-snippets.feature features/live-cucumber-summary.feature features/live-cucumber-json.feature features/live-cucumber-junit-xml.feature features/live-cucumber-usage.feature features/live-cucumber-usage-json.feature features/native-allure-reporting.feature -m e2e -q
platform =
    lin: linux
    mac: darwin
    win: win32

[testenv:py314-pytestlatest-xdist-remote-socket-lin]
description = xdist worker reporting over direct TCP socket
extras = test,struct-bdd
deps = pytest-xdist<4
pass_env = PYTEST_CUKE_REMOTE_RUNTIME_EVIDENCE
commands = python -m pytest tests/external/test_remote_xdist_reporting.py -m external -k socket -q

[testenv:py314-pytestlatest-xdist-remote-via-lin]
description = xdist worker reporting through an execnet via gateway
extras = test,struct-bdd
deps = pytest-xdist<4
pass_env = PYTEST_CUKE_REMOTE_RUNTIME_EVIDENCE
commands = python -m pytest tests/external/test_remote_xdist_reporting.py -m external -k via -q

[testenv:py314-pytestlatest-xdist-remote-ssh-lin]
description = xdist worker reporting over SSH to separate worker containers
extras = test,struct-bdd
deps = pytest-xdist<4
pass_env = PYTEST_CUKE_REMOTE_RUNTIME_EVIDENCE
commands = python -m pytest tests/external/test_remote_xdist_reporting.py -m external -k ssh -q

[testenv:py314-pytestlatest-xdist-remote-socket-win]
description = manual Windows xdist worker reporting over direct TCP socket
extras = test,struct-bdd
deps = pytest-xdist<4
pass_env = PYTEST_CUKE_REMOTE_RUNTIME_EVIDENCE
platform = win32
commands = python -m pytest tests/external/test_remote_xdist_reporting.py -m external -k socket -q

[testenv:py314-pytestlatest-xdist-remote-via-win]
description = manual Windows xdist worker reporting through an execnet via gateway
extras = test,struct-bdd
deps = pytest-xdist<4
pass_env = PYTEST_CUKE_REMOTE_RUNTIME_EVIDENCE
platform = win32
commands = python -m pytest tests/external/test_remote_xdist_reporting.py -m external -k via -q

[testenv:py314-pytestlatest-xdist-remote-ssh-win]
description = manual Windows xdist worker reporting over SSH to separate worker containers
extras = test,struct-bdd
deps = pytest-xdist<4
pass_env = PYTEST_CUKE_REMOTE_RUNTIME_EVIDENCE
platform = win32
commands = python -m pytest tests/external/test_remote_xdist_reporting.py -m external -k ssh -q

[testenv:native-go-parser]
description = build and test the optional native Go parser from a source distribution
base_python = python3.10
extras = test,struct-bdd
deps =
    build
    uv>=0.8
set_env =
    PYTEST_CUKE_BUILD_GO = off
commands =
    python -m build --sdist --outdir {envtmpdir}/source
    python scripts/test_native_go_parser.py {envtmpdir}/source

[testenv:py314-pre-commit-lin]
description = run all pinned pre-commit hooks
base_python = python3.14
skip_install = true
deps = pre-commit
commands = pre-commit run --all-files

[testenv:py314-ruff]
description = run Ruff against runtime and CI compatibility carriers
base_python = python3.14
skip_install = true
deps = ruff>=0.4.0
commands = ruff check src/pytest_cuke/compatibility/runtime_compat.py src/pytest_cuke/compatibility/environment_matrix.py src/pytest_cuke/compatibility_cli.py src/pytest_cuke/hooks.py src/pytest_cuke/script/bdd_tree_to_rst.py scripts/env_matrix.py scripts/environment_evidence.py scripts/run_env_matrix_cell.py scripts/aggregate_env_evidence.py scripts/test_native_go_parser.py tests/e2e/environment_inventory_steps.py tests/e2e/environment_policy_ledger_steps.py tests/e2e/environment_proof_aggregation_steps.py tests/e2e/browser_report_steps.py tests/external/test_remote_xdist_reporting.py tests/external/remote-xdist/controller_runner.py tests/external/remote-xdist/worker_service.py tests/external/remote-xdist/project/conftest.py tests/unit/compatibility/test_runtime_compat.py conftest.py

[testenv:py314-doc-gen]
description = run documentation-generation acceptance with its optional dependencies
base_python = python3.14
extras = test,struct-bdd,doc-gen
commands = python -m pytest tests/unit/docs/test_doc.py -m doc_gen -q

[testenv:typecheck]
description = run the complete typecheck suite
base_python = python3.14
deps =
    .[testtypes]
    .[test]
    .[debug-mcp]
commands =
    python scripts/check_types.py
    python -m mypy --config-file pyproject.toml src/pytest_cuke/model/message_extension.py src/pytest_cuke/model/message_converter.py src/pytest_cuke/model/message_stream_validation.py src/pytest_cuke/message_plugin.py src/pytest_cuke/compatibility/environment_matrix.py src/pytest_cuke/compatibility_cli.py
    python -m pytest -c pyproject.toml -m typecheck features/mypy-runtime-gate.feature -q

[testenv:py314-pytest90-mypy]
description = type-check runtime with pytest 9.0 installed
base_python = python3.14
extras = test,testtypes,debug-mcp
deps = pytest~=9.0.0
commands = python scripts/check_types.py

[testenv:py314-pytestlatest-mypy]
description = type-check runtime with latest pytest installed
base_python = python3.14
extras = test,testtypes,debug-mcp
deps = pytest
commands = python scripts/check_types.py

[testenv:py314-pytestlatest-mypy-messages]
description = type-check Messages integrations with latest pytest installed
base_python = python3.14
extras = test,testtypes
deps = pytest
commands =
    python -m mypy --config-file pyproject.toml src/pytest_cuke/model/message_extension.py src/pytest_cuke/model/message_converter.py src/pytest_cuke/model/message_stream_validation.py src/pytest_cuke/message_plugin.py

[testenv:messages-schema]
description = verify pinned Cucumber Messages schema assets
base_python = python3.14
commands = cuke sync messages schemas --schema-path src/pytest_cuke/model/message_schemas --source-dir tests/fixtures/message-schemas-v24-0-1 --check
