[tox]
requires =
    tox>=4.2
env_list =
    py313-pre-commit-lin
    py313-pytest{83, 82, 81, 80, 74, 73, 72, 71, 70, latest}-mypy
    py313-pytest{83, 82, 81, 80, 74, 73, 72, 71, 70, latest}-coverage-{lin, mac}
    py313-pytest{83, 82, 81, 80, latest}-coverage-win
    py313-pytestlatest-gherkin{25, latest}-xdist-coverage-{lin, win, mac}
    py313-pytest80-allure-coverage-{lin, win, mac}
    py312-pytest{74, 73, 72, 71, 70}-coverage-win
    pypy310-pytestlatest-coverage-{lin, win, mac}
    py{312, 311, 310, 39}-pytestlatest-mypy
    py{py310, py39, 312, 311, 310, 39}-pytestlatest-coverage-lin
    py{py310, py39, 313, 312, 311, 310, 39}-pytestlatest-xdist-coverage-lin
distshare = {homedir}/.tox/distshare

[testenv]
deps =
    .[struct-bdd]
    .[test]
    .[doc-gen]
    allure: .[allure]
    allure: allure-python-commons-test
    coverage: coverage
    gherkin25: gherkin-official~=25.0.0
    gherkinlatest: gherkin-official~=29.0.0
    pytest70: pytest~=7.0.0
    pytest71: pytest~=7.1.0
    pytest72: pytest~=7.2.0
    pytest73: pytest~=7.3.0
    pytest74: pytest~=7.4.0
    pytest80: pytest~=8.0.0
    pytest81: pytest~=8.1.0
    pytest82: pytest~=8.2.0
    pytest83: pytest~=8.3.0
    pytestlatest: pytest
    xdist: pytest-xdist
set_env =
    COLUMNS = 80
    coverage: _PYTEST_CMD = coverage run --parallel-mode -m pytest
    xdist: _PYTEST_MORE_ARGS = -n3 -rfsxX
    xdist-lin: _PYTEST_MORE_ARGS = -n4 -rfsxX
commands =
    {env:_PYTEST_CMD:pytest} {env:_PYTEST_MORE_ARGS:} {posargs:-vvl}
    coverage: coverage combine
    coverage-!xdist: coverage report
platform =
    lin: linux
    mac: darwin
    win: win32

[testenv:py313-pre-commit]
skip_install = true
deps =
    pre-commit
commands =
    pre-commit run --all-files

[testenv:py{39,310,311,312,313}-pytest{latest,70,71,72,73,74,80,81,82,83,84}-mypy]
deps =
    mypy>=1.10.0
commands =
    python -m mypy

[gh-actions]
python =
    3.9: py39
    3.10: py310
    3.11: py311
    3.12: py312
    3.13: py313
    pypy-3.9: pypy39
    pypy-3.10: pypy310
