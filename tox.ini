[tox]
requires =
    tox>=4.2
env_list =
    py314-pre-commit-lin
    py314-pytest{90, latest}-mypy
    py314-pytestlatest-mypy-messages
    py314-pytest{90, latest}-coverage-{lin, mac}
    py314-pytest{90, latest}-coverage-win
    py314-pytestlatest-gherkin{33, latest}-xdist-coverage-{lin, win, mac}
    py313-pytest{90, 84, 83, 82, 81, 80, latest}-mypy
    py313-pytest{90, 84, 83, 82, 81, 80, latest}-coverage-{lin, mac}
    py313-pytest{90, 84, 83, 82, 81, 80, latest}-coverage-win
    py312-pytest{74, 73, 72, 71, 70}-coverage-win
    py{py311, py310}-pytestlatest-coverage-{win, mac}
    py{314, 313, 312, 311, 310}-pytestlatest-mypy
    py{py311, py310, 314, 313, 312, 311, 310}-pytestlatest-coverage-lin
    py{py311, py310, 314, 313, 312, 311, 310}-pytestlatest-xdist-coverage-lin
    py{314, 313, 312, 311, 310}-ruff
distshare = {homedir}/.tox/distshare

[testenv]
deps =
    .[doc-gen]
    .[struct-bdd]
    .[test]
    coverage: coverage
    gherkin33: gherkin-official~=33.0.0
    gherkinlatest: gherkin-official
    pytest70: pytest~=7.0.0
    pytest71: pytest~=7.1.0
    pytest72: pytest~=7.2.0
    pytest73: pytest~=7.3.0
    pytest74: pytest~=7.4.0
    pytest80: pytest~=8.0.0
    pytest81: pytest~=8.1.0
    pytest82: pytest~=8.2.0
    pytest83: pytest~=8.3.0
    pytest90: pytest~=9.0.0
    pytestlatest: pytest
    xdist: pytest-xdist
set_env =
    COLUMNS = 80
    coverage: _PYTEST_CMD = coverage run --append -m pytest
    xdist: _PYTEST_MORE_ARGS = -n3 -rfsxX
commands =
    {env:_PYTEST_CMD:pytest} {env:_PYTEST_MORE_ARGS:} {posargs:-vvl}
platform =
    lin: linux
    mac: darwin
    win: win32

[testenv:py314-pytestlatest-mypy-messages]
deps =
    .[testtypes]
commands =
    python -m mypy --config-file pyproject.toml --follow-imports=skip src/pytest_bdd/model/message_extension.py src/pytest_bdd/model/message_converter.py src/pytest_bdd/model/message_validation.py src/pytest_bdd/plugin/gherkin_message_reporter

[testenv:py{313,314}-pre-commit]
skip_install = true
deps =
    pre-commit
commands =
    pre-commit run --all-files

[testenv:py{310,311,312,313,314}-pytest{latest,70,71,72,73,74,80,81,82,83,84,90}-mypy]
deps =
    .[testtypes]
commands =
    python -m mypy --config-file pyproject.toml

[testenv:py{310,311,312,313,314}-ruff]
deps =
    .[testtypes]
    ruff
commands =
    ruff check src tests docs
    ruff format --check src tests docs
allowlist_externals =
    ruff

[gh-actions]
python =
    3.10: py310
    3.11: py311
    3.12: py312
    3.13: py313
    3.14: py314
    pypy-3.10: pypy310
    pypy-3.11: pypy311
