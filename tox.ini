[tox]
requires =
    tox>=4.2
env_list =
    typecheck
    py313-pre-commit-lin
    py313-pytest{625, 83, 82, 81, 80, 74, 73, 72, 71, 70, latest}-coverage-{lin, mac}
    py313-pytest{83, 82, 81, 80, latest}-coverage-win
    py313-pytestlatest-gherkin{25, latest}-xdist-coverage-{lin, win, mac}
    py313-pytest80-allure-coverage-{lin, win, mac}
    py312-pytest{74, 73, 72, 71, 70}-coverage-win
    pypy310-pytestlatest-coverage-{lin, win, mac}
    pypy39-pytest{62, 54}-coverage-{lin, win, mac}
    py{py310, py39, 312, 311, 310, 39}-pytestlatest-coverage-lin
    py{py310, py39, 313, 312, 311, 310, 39}-pytestlatest-xdist-coverage-lin
distshare = {homedir}/.tox/distshare

# Lane policy (#233): frozen Python x pytest "compat" lanes stay sequential -
# xdist can mask ordering assumptions in lanes that exist to freeze behavior.
# xdist lanes are not coverage-gated: raw `coverage run` does not measure xdist
# workers (#208), and the sequential twins already enforce fail_under on the
# same code.
[testenv]
deps =
    .[struct-bdd]
    .[test]
    .[doc-gen]
    allure: .[allure]
    allure: allure-python-commons-test
    coverage: coverage
    gherkin25: gherkin-official~=25.0.0
    gherkinlatest: gherkin-official~=29.0.0
    pytest70: pytest~=7.0.0
    pytest71: pytest~=7.1.0
    pytest72: pytest~=7.2.0
    pytest73: pytest~=7.3.0
    pytest74: pytest~=7.4.0
    pytest80: pytest~=8.0.0
    pytest81: pytest~=8.1.0
    pytest82: pytest~=8.2.0
    pytest83: pytest~=8.3.0
    pytestlatest: pytest
    xdist: pytest-xdist
set_env =
    COLUMNS = 80
    coverage: _PYTEST_CMD = coverage run --parallel-mode -m pytest
    xdist: _PYTEST_MORE_ARGS = -n3 -rfsxX
    xdist-lin: _PYTEST_MORE_ARGS = -n4 -rfsxX
commands =
    {env:_PYTEST_CMD:pytest} {env:_PYTEST_MORE_ARGS:} {posargs:-vvl}
    coverage: coverage combine
    coverage-!xdist: coverage report
platform =
    lin: linux
    mac: darwin
    win: win32

[testenv:py313-pre-commit]
skip_install = true
deps =
    pre-commit
    .[testtypes]
commands =
    pre-commit run --all-files

[testenv:typecheck]
base_python = python3.13
deps =
    .[testtypes]
    .[test]
commands =
    python scripts/check_types.py
    python -m mypy --config-file pyproject.toml src/pytest_cuke/model/message_extension.py src/pytest_cuke/model/message_converter.py src/pytest_cuke/model/message_stream_validation.py src/pytest_cuke/message_plugin.py
    pytest -c pyproject.toml -m typecheck features/mypy-runtime-gate.feature -q

[testenv:messages-schema]
base_python = python3.13
commands =
    cuke sync messages schemas --schema-path src/pytest_cuke/model/message_schemas --source-dir tests/fixtures/message-schemas-v24-0-1 --check

[gh-actions]
python =
    3.9: py39
    3.10: py310
    3.11: py311
    3.12: py312
    3.13: py313
    pypy-3.9: pypy39
    pypy-3.10: pypy310
