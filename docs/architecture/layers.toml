# docs/architecture/layers.toml
# Strict cycle-free DAG architecture specification for pytest-cuke.
# A module imports only from its own layer and below, never above.

[layers]
L0 = { order = 0, name = "core", allowed_imports = [] }
L1 = { order = 1, name = "compatibility", allowed_imports = ["L0"] }
L2a = { order = 2, name = "domain", allowed_imports = ["L0"] }
L2b = { order = 3, name = "message", allowed_imports = ["L0", "L1", "L2a"] }
L2c = { order = 4, name = "runtime", allowed_imports = ["L0", "L1", "L2a", "L2b"] }
L3 = { order = 5, name = "parsing", allowed_imports = ["L0", "L1", "L2a", "L2b", "L2c"] }
L4 = { order = 6, name = "steps", allowed_imports = ["L0", "L1", "L2a", "L2b", "L2c", "L3"] }
L5 = { order = 7, name = "collection_execution", allowed_imports = ["L0", "L1", "L2a", "L2b", "L2c", "L3", "L4"] }
L6 = { order = 8, name = "plugins", allowed_imports = ["L0", "L1", "L2a", "L2b", "L2c", "L3", "L4", "L5"] }
L7 = { order = 9, name = "bootstrap", allowed_imports = ["L0", "L1", "L2a", "L2b", "L2c", "L3", "L4", "L5", "L6"] }

[modules]
"pytest_cuke.const" = "L0"
"pytest_cuke.exceptions" = "L0"
"pytest_cuke.warning_types" = "L0"
"pytest_cuke.types" = "L0"
"pytest_cuke.mimetype" = "L0"
"pytest_cuke.utils" = "L0"
"pytest_cuke.util" = "L0"
"pytest_cuke.packaging" = "L0"
"pytest_cuke.npm_resource" = "L0"
"pytest_cuke.compatibility" = "L1"
"pytest_cuke.model.message_capability" = "L2b"
"pytest_cuke.model.message_converter" = "L2b"
"pytest_cuke.model.message_extension" = "L2b"
"pytest_cuke.model.messages_extension" = "L2b"
"pytest_cuke.model.message_serialization" = "L2b"
"pytest_cuke.model.message_transport" = "L2b"
"pytest_cuke.model.message_registry" = "L2b"
"pytest_cuke.model.message_stream_validation" = "L2b"
"pytest_cuke.model.feature_binding" = "L2c"
"pytest_cuke.model.stash_access" = "L2c"
"pytest_cuke.model.scenario_run" = "L2c"
"pytest_cuke.model.session_run" = "L2c"
"pytest_cuke.model.run_access" = "L2c"
"pytest_cuke.model.scenario_report" = "L2c"
"pytest_cuke.model" = "L2a"
"pytest_cuke.message_converter" = "L2b"
"pytest_cuke.messages" = "L2b"
"pytest_cuke.runtime" = "L2c"
"pytest_cuke.lifecycle" = "L2c"
"pytest_cuke.scenario_run" = "L2c"
"pytest_cuke.run" = "L2c"
"pytest_cuke.parser" = "L3"
"pytest_cuke.parsers" = "L3"
"pytest_cuke.tag_expression" = "L3"
"pytest_cuke.steps" = "L4"
"pytest_cuke.hooks" = "L5"
"pytest_cuke.hook" = "L5"
