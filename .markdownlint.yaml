---
default: true
# Line length is intentionally not enforced globally. Generated docs and
# contract fixtures use long lines that are not meaningful to wrap.
MD013: false
# Headings should be surrounded by blank lines
MD022: false
# No trailing punctuation in headings
MD026: false
# MD032: Lists should be surrounded by blank lines
MD032: false
# MD033: Inline HTML
MD033: false
# MD041: First line in a file should be a top-level heading
#   PLAN.md files use YAML frontmatter; first content line is <objective> XML
MD041: false
# MD007: Unordered list indentation
#   Bold text + sub-lists trigger false positives in our document style
MD007: false
# MD031: Blanks around fenced code blocks
#   PLAN.md interfaces/context blocks use adjacent fences without blank lines
MD031: false
# MD046: Code block style
#   PLAN.md files use indentation for XML structure, not code blocks
MD046: false
# MD058: Blanks around tables
#   PLAN.md tables inside XML blocks without surrounding blanks
MD058: false
