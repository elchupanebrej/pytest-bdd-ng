# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
---
default_language_version:
  python: python3.14
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.0
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix, src, tests, docs]
        files: ^(src|tests|docs)/
      - id: ruff-format
        args: [src, tests, docs]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: "^.*\\.rst$"
      - id: end-of-file-fixer
        exclude: "^.*\\.rst$"
      - id: check-yaml
      - id: check-added-large-files
      - id: check-toml
  - repo: https://github.com/tox-dev/tox-ini-fmt
    rev: "1.5.0"
    hooks:
      - id: tox-ini-fmt
  - repo: https://github.com/adrienverge/yamllint.git
    rev: v1.37.1
    hooks:
      - id: yamllint
        args: [--format, parsable, --strict]
        exclude: ^specs/
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.45.0
    hooks:
      - id: markdownlint
        # Use a managed nodeenv so WSL does not pick up the Windows npm shim.
        language_version: 22.0.0
        exclude: ^(specs/|AGENTS\.md$)
  - repo: https://github.com/macisamuele/language-formatters-pre-commit-hooks
    rev: v2.14.0
    hooks:
      - id: pretty-format-toml
        args: [--autofix]
  - repo: local
    hooks:
      - id: generate-feature-doc
        name: generate-feature-doc
        entry: >-
          uv run --extra doc-gen --frozen python
          src/pytest_bdd/script/bdd_tree_to_rst.py features docs/features
        language: system
        pass_filenames: false
      - id: validate-feature-headings
        name: validate-feature-headings
        entry: >-
          uv run python
          src/pytest_bdd/script/validate_feature_headings.py
          --root-path features
        language: system
        files: ^features/
        pass_filenames: false
