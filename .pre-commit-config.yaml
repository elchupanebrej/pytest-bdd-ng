---
default_language_version:
  python: python3.14
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.4
    hooks:
      - id: ruff
        args: [--fix]
        files: &ruff_scope >-
            (?x)^(?:src/pytest_cuke/compatibility/(?:runtime_compat|environment_matrix|pytest)\.py
            |src/pytest_cuke/(?:compatibility_cli|hooks)\.py
            |src/pytest_cuke/script/bdd_tree_to_rst\.py
            |scripts/(?:env_matrix|environment_evidence|run_env_matrix_cell|aggregate_env_evidence|test_native_go_parser)\.py
            |tests/e2e/(?:environment_inventory_steps|environment_policy_ledger_steps|environment_proof_aggregation_steps|browser_report_steps)\.py
            |tests/external/test_remote_xdist_reporting\.py
            |tests/external/remote-xdist/(?:controller_runner|worker_service|project/conftest)\.py
            |tests/unit/compatibility/test_runtime_compat\.py
            |conftest\.py)$
      - id: ruff-format
        files: *ruff_scope
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        # These vendored schemas must retain their exact upstream bytes.
        exclude: >-
            (?x)^(?:src/pytest_cuke/model/message_schemas/.*\.schema\.json
            |tests/fixtures/message-schemas-v\d+-\d+-\d+/jsonschema/.*\.json
            |docs/features/.*\.rst)$
      - id: end-of-file-fixer
        # These vendored schemas must retain their exact upstream bytes.
        exclude: ^(?:src/pytest_cuke/model/message_schemas/.*\.schema\.json|tests/fixtures/message-schemas-v\d+-\d+-\d+/jsonschema/.*\.json)$
      - id: check-yaml
      - id: check-added-large-files
      - id: check-toml
  - repo: local
    hooks:
      - id: mypy-runtime-source
        name: mypy (complete runtime source)
        entry: python scripts/check_types.py
        language: system
        pass_filenames: false
        always_run: true
