# TODO Move to pyproject.toml after sections will leave beta
[options]
include_package_data = True
packages = find:
package_dir =
    =src

[options.packages.find]
where = src
[options.package_data]
pytest_bdd.template =
    feature_include.rst.jinja2
    features_index.rst.jinja2
    features_section.rst.jinja2
    test.py.jinja2
pytest_bdd =
    markdown_parser.js
pytest_bdd.plugin.gherkin_message_reporter.resources.templates =
    live_formatter_bridge.mjs.j2
    formatter_adapter_support.cjs.j2
pytest_bdd.plugin.gherkin_message_reporter.resources.templates.formatters =
    pretty.cjs.j2
    progress.cjs.j2
    progress_bar.cjs.j2
    usage.cjs.j2
    junit.cjs.j2
