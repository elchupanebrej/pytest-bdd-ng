# TODO Move to pyproject.toml after sections will leave beta
[options]
include_package_data = True
packages = find:
package_dir =
    =src

[options.packages.find]
where = src
[options.package_data]
pytest_cuke.template =
    test.py.mak
pytest_cuke =
    py.typed
    markdown_parser.js
    model/message_schemas/*.schema.json
pytest_cuke._native_go =
    *.so
    *.dll
    *.dylib
