---
openapi: 3.0.3
info:
  title: Python/Pytest Compatibility Contract
  version: 1.3.0
  description: >-
    Contract for supported compatibility matrix evaluation with
    explicit EOL-floor exclusions (Python 3.9 and pytest<6.2.5).
paths:
  /compatibility/policy:
    get:
      summary: Return active support floor policy
      responses:
        '200':
          description: Active compatibility policy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompatibilityPolicy'

  /compatibility/matrix:
    get:
      summary: List compatibility matrix entries
      parameters:
        - in: query
          name: supportedOnly
          schema:
            type: boolean
            default: true
      responses:
        '200':
          description: Matrix entries
          content:
            application/json:
              schema:
                type: object
                required: [entries]
                properties:
                  entries:
                    type: array
                    items:
                      $ref: '#/components/schemas/CompatibilityMatrixEntry'

  /compatibility/validate:
    get:
      summary: Validate one Python/pytest pair
      parameters:
        - in: query
          name: pythonVersion
          required: true
          schema:
            type: string
        - in: query
          name: pytestVersion
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Pair validation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PairValidationResult'

components:
  schemas:
    CompatibilityPolicy:
      type: object
      required:
        - minPython
        - maxPython
        - minPytest
        - compatibilitySource
        - eolExclusions
      properties:
        minPython:
          type: string
          example: '3.10'
        maxPython:
          type: string
          example: '3.14'
        minPytest:
          type: string
          example: '6.2.5'
        compatibilitySource:
          type: string
          enum: [pytest-matrix]
        eolExclusions:
          type: array
          items:
            type: string
          example: [python<3.10, pytest<6.2.5]

    CompatibilityMatrixEntry:
      type: object
      required:
        - pythonVersion
        - pytestVersion
        - isCompatible
        - isSupported
        - reasonCode
        - message
      properties:
        pythonVersion:
          type: string
        pytestVersion:
          type: string
        isCompatible:
          type: boolean
        isSupported:
          type: boolean
        reasonCode:
          type: string
          enum:
            - compatible
            - python_not_supported_by_pytest
            - pytest_unavailable
            - python_unavailable
            - eol_python
            - eol_pytest
        message:
          type: string
        toxEnvName:
          type: string
          nullable: true
        platforms:
          type: array
          items:
            type: string
            enum: [lin, mac, win]

    PairValidationResult:
      allOf:
        - $ref: '#/components/schemas/CompatibilityMatrixEntry'
        - type: object
          required: [validatedAt]
          properties:
            validatedAt:
              type: string
              format: date-time
