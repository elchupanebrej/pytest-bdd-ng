---
openapi: 3.0.3
info:
  title: Python/Pytest Compatibility Contract
  version: 1.2.0
  description: >-
    Contract for compatibility matrix operations and feature scope tracking.
paths:
  /compatibility/matrix:
    get:
      summary: List compatibility matrix entries
      parameters:
        - in: query
          name: compatibleOnly
          schema:
            type: boolean
            default: true
      responses:
        '200':
          description: Matrix entries
          content:
            application/json:
              schema:
                type: object
                required: [entries]
                properties:
                  entries:
                    type: array
                    items:
                      $ref: '#/components/schemas/CompatibilityMatrixEntry'
  /compatibility/validate:
    get:
      summary: Validate one Python/pytest pair
      parameters:
        - in: query
          name: pythonVersion
          required: true
          schema:
            type: string
        - in: query
          name: pytestVersion
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Pair compatibility result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PairValidationResult'
  /compatibility/jobs/expand:
    post:
      summary: Expand tox environment names for compatible entries
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [entries]
              properties:
                entries:
                  type: array
                  items:
                    type: object
                    required: [pythonVersion, pytestVersion]
                    properties:
                      pythonVersion:
                        type: string
                      pytestVersion:
                        type: string
      responses:
        '200':
          description: Expanded tox env names
          content:
            application/json:
              schema:
                type: object
                required: [toxEnvNames]
                properties:
                  toxEnvNames:
                    type: array
                    items:
                      type: string
  /feature/scope/uncommitted-files:
    get:
      summary: List uncommitted files included in this feature scope
      responses:
        '200':
          description: In-scope file list
          content:
            application/json:
              schema:
                type: object
                required: [files]
                properties:
                  files:
                    type: array
                    items:
                      $ref: '#/components/schemas/FeatureScopeFile'
components:
  schemas:
    CompatibilityMatrixEntry:
      type: object
      required: [pythonVersion, pytestVersion, isCompatible, reasonCode]
      properties:
        pythonVersion:
          type: string
        pytestVersion:
          type: string
        isCompatible:
          type: boolean
        reasonCode:
          type: string
          enum:
            - compatible
            - python_not_supported_by_pytest
            - pytest_unavailable
            - python_unavailable
        toxEnvName:
          type: string
          nullable: true
        platforms:
          type: array
          items:
            type: string
            enum: [lin, mac, win]
    PairValidationResult:
      type: object
      required:
        - pythonVersion
        - pytestVersion
        - isCompatible
        - reasonCode
        - message
      properties:
        pythonVersion:
          type: string
        pytestVersion:
          type: string
        isCompatible:
          type: boolean
        reasonCode:
          type: string
        message:
          type: string
    FeatureScopeFile:
      type: object
      required: [path, changeType, includedInFeature]
      properties:
        path:
          type: string
        changeType:
          type: string
          enum: [modified, added, deleted]
        includedInFeature:
          type: boolean
          enum: [true]
