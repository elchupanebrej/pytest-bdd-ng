---
openapi: 3.1.0
info:
  title: Event Message Reporting Contract
  version: 1.0.0
  description: >-
    Design-time contract for canonical message-based reporting, derived legacy/output
    consistency, and spec-prefix conflict governance.
servers:
  - url: https://reporting.local
paths:
  /reporting/messages/emit:
    post:
      summary: Emit canonical reporting envelopes for one execution context
      operationId: emitReportingMessages
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmitMessagesRequest'
      responses:
        '200':
          description: Canonical messages accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmitMessagesResponse'
  /reporting/messages/validate:
    post:
      summary: Validate message stream consistency and lifecycle linkage
      operationId: validateMessageStream
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidateMessageStreamRequest'
      responses:
        '200':
          description: Validation completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageValidationResult'
  /reporting/reports/derive:
    post:
      summary: Derive legacy and user-facing report outputs from canonical messages
      operationId: deriveReportOutputs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeriveReportsRequest'
      responses:
        '200':
          description: Derived outputs generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeriveReportsResponse'
  /governance/spec-prefix/audit:
    post:
      summary: Audit spec directory prefixes for uniqueness conflicts
      operationId: auditSpecPrefixes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpecPrefixAuditRequest'
      responses:
        '200':
          description: Prefix audit completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpecPrefixAuditResponse'
components:
  schemas:
    ImplementationStatus:
      type: string
      enum:
        - done
        - non-implementable
        - not-acceptable
    StatusApplicability:
      type: string
      enum:
        - required
        - optional
        - not_applicable
    MessageTypeStatusRule:
      type: object
      additionalProperties: false
      required:
        - payload_kind
        - status_applicability
      properties:
        payload_kind:
          type: string
          enum:
            - meta
            - source
            - gherkin_document
            - pickle
            - step_definition
            - parameter_type
            - hook
            - test_run_started
            - test_case
            - test_case_started
            - test_step_started
            - test_step_finished
            - test_case_finished
            - test_run_finished
            - attachment
        status_applicability:
          $ref: '#/components/schemas/StatusApplicability'
    StatusGovernancePolicy:
      type: object
      additionalProperties: false
      required:
        - allowed_statuses
        - unknown_status_policy
        - required_comment_statuses
        - message_type_rules
      properties:
        allowed_statuses:
          type: array
          minItems: 3
          items:
            $ref: '#/components/schemas/ImplementationStatus'
        unknown_status_policy:
          type: string
          enum:
            - reject
        required_comment_statuses:
          type: array
          minItems: 2
          items:
            $ref: '#/components/schemas/ImplementationStatus'
        message_type_rules:
          type: array
          minItems: 15
          items:
            $ref: '#/components/schemas/MessageTypeStatusRule'
    Correlation:
      type: object
      additionalProperties: false
      required:
        - run_id
        - scenario_attempt_id
        - worker_id
        - attempt_index
      properties:
        run_id:
          type: string
        scenario_attempt_id:
          type: string
          description: Unique per scenario execution attempt across retries/workers.
        step_id:
          type: string
          nullable: true
        worker_id:
          type: string
        attempt_index:
          type: integer
          minimum: 0
    EventEnvelope:
      type: object
      additionalProperties: false
      required:
        - payload_kind
        - payload
        - emitted_at
      properties:
        payload_kind:
          type: string
          enum:
            - meta
            - source
            - gherkin_document
            - pickle
            - step_definition
            - parameter_type
            - hook
            - test_run_started
            - test_case
            - test_case_started
            - test_step_started
            - test_step_finished
            - test_case_finished
            - test_run_finished
            - attachment
        payload:
          type: object
        emitted_at:
          type: string
          format: date-time
        correlation:
          $ref: '#/components/schemas/Correlation'
        implementation_status:
          $ref: '#/components/schemas/ImplementationStatus'
        implementation_comment:
          type: string
          minLength: 1
          nullable: true
        status_applicability:
          $ref: '#/components/schemas/StatusApplicability'
        comment_present:
          type: boolean
        hook_origin:
          type: string
    EmitMessagesRequest:
      type: object
      additionalProperties: false
      required:
        - protocol_version
        - reporting_enabled
        - envelopes
      properties:
        protocol_version:
          type: string
          description: Must be the latest supported message protocol version.
        reporting_enabled:
          type: boolean
        envelopes:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/EventEnvelope'
    EmitMessagesResponse:
      type: object
      additionalProperties: false
      required:
        - accepted
        - emitted_count
      properties:
        accepted:
          type: boolean
        emitted_count:
          type: integer
          minimum: 0
        error_policy:
          type: string
          enum:
            - fail_when_reporting_enabled
            - continue_when_reporting_disabled
    ValidateMessageStreamRequest:
      type: object
      additionalProperties: false
      required:
        - protocol_version
        - envelopes
      properties:
        protocol_version:
          type: string
        envelopes:
          type: array
          items:
            $ref: '#/components/schemas/EventEnvelope'
        require_latest_protocol:
          type: boolean
          default: true
    MessageValidationViolation:
      type: object
      additionalProperties: false
      required:
        - code
        - message
      properties:
        code:
          type: string
          enum:
            - ORPHAN_REFERENCE
            - DUPLICATE_LIFECYCLE_ID
            - INVALID_PAYLOAD_SHAPE
            - OUT_OF_ORDER_LIFECYCLE
            - UNSUPPORTED_PROTOCOL_VERSION
            - UNKNOWN_IMPLEMENTATION_STATUS
            - MISSING_REQUIRED_IMPLEMENTATION_COMMENT
            - CONFLICTING_TERMINAL_STATUS
            - STATUS_ON_NOT_APPLICABLE_MESSAGE
        message:
          type: string
    MessageValidationResult:
      type: object
      additionalProperties: false
      required:
        - status
        - orphan_reference_count
        - duplicate_lifecycle_id_count
        - blocked_for_release
        - violations
      properties:
        status:
          type: string
          enum: [pass, fail]
        orphan_reference_count:
          type: integer
          minimum: 0
        duplicate_lifecycle_id_count:
          type: integer
          minimum: 0
        blocked_for_release:
          type: boolean
        violations:
          type: array
          items:
            $ref: '#/components/schemas/MessageValidationViolation'
    DeriveReportsRequest:
      type: object
      additionalProperties: false
      required:
        - run_id
        - envelopes
        - output_kinds
      properties:
        run_id:
          type: string
        envelopes:
          type: array
          items:
            $ref: '#/components/schemas/EventEnvelope'
        output_kinds:
          type: array
          items:
            type: string
            enum:
              - scenario_report
              - terminal_output
              - json_output
    DerivedOutput:
      type: object
      additionalProperties: false
      required:
        - kind
        - run_id
        - consistency_status
      properties:
        kind:
          type: string
          enum:
            - scenario_report
            - terminal_output
            - json_output
        run_id:
          type: string
        consistency_status:
          type: string
          enum: [consistent, inconsistent]
        details:
          type: object
          additionalProperties: true
    DeriveReportsResponse:
      type: object
      additionalProperties: false
      required:
        - outputs
      properties:
        outputs:
          type: array
          items:
            $ref: '#/components/schemas/DerivedOutput'
    SpecPrefixAuditRequest:
      type: object
      additionalProperties: false
      required:
        - specs_root
      properties:
        specs_root:
          type: string
          example: /Users/goloveshkokonstantin/Projects/pytest-bdd-ng/specs
    SpecPrefixConflict:
      type: object
      additionalProperties: false
      required:
        - prefix
        - conflicting_paths
      properties:
        prefix:
          type: string
          pattern: '^[0-9]{3}$'
        conflicting_paths:
          type: array
          minItems: 2
          items:
            type: string
        recommended_next_prefix:
          type: string
          pattern: '^[0-9]{3}$'
    SpecPrefixAuditResponse:
      type: object
      additionalProperties: false
      required:
        - status
        - conflicts
      properties:
        status:
          type: string
          enum: [pass, fail]
        conflicts:
          type: array
          items:
            $ref: '#/components/schemas/SpecPrefixConflict'
