---
openapi: 3.0.3
info:
  title: E2E Conversion Tracking Contract
  version: 0.2.0
  description: >-
    Contract for conversion inventory, marker classification, parity audit
    status, and cycle-based migration metrics for E2E feature conversion.
paths:
  /conversion-candidates:
    get:
      summary: List conversion candidates with rubric classification
      responses:
        '200':
          description: Candidate list
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ConversionCandidate'
  /conversion-candidates/summary:
    get:
      summary: Get migration summary for convert candidates
      responses:
        '200':
          description: Migration summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MigrationSummary'
  /parity-audit-entries:
    get:
      summary: List parity audit entries
      responses:
        '200':
          description: Parity audit list
          content:
            application/json:
              schema:
                type: object
                required: [entries]
                properties:
                  entries:
                    type: array
                    items:
                      $ref: '#/components/schemas/ParityAuditEntry'
components:
  schemas:
    ConversionCandidate:
      type: object
      required:
        - sourceTestPath
        - priority
        - classification
        - userFacingValue
        - externalObservability
        - stabilitySuitability
        - decisionRationale
      properties:
        sourceTestPath:
          type: string
        priority:
          type: string
          enum: [high, medium, low]
        classification:
          type: string
          enum: [convert_candidate, retain_technical, deferred_conversion]
        marker:
          type: string
          enum:
            - e2e_convert_candidate
            - e2e_retain_technical
            - e2e_deferred_conversion
        userFacingValue:
          type: boolean
        externalObservability:
          type: boolean
        stabilitySuitability:
          type: boolean
        decisionRationale:
          type: string
        targetCycle:
          type: string
          nullable: true
        unblockCondition:
          type: string
          nullable: true
    MigrationSummary:
      type: object
      required:
        - totalConvertCandidates
        - convertedToFeatures
        - coveragePercent
        - thresholdPercent
        - thresholdMet
      properties:
        totalConvertCandidates:
          type: integer
        convertedToFeatures:
          type: integer
        coveragePercent:
          type: number
        thresholdPercent:
          type: number
          enum: [80]
        thresholdMet:
          type: boolean
    ParityAuditEntry:
      type: object
      required:
        - taskId
        - sourceTestPath
        - featurePath
        - verdict
        - findings
      properties:
        taskId:
          type: string
        sourceTestPath:
          type: string
        featurePath:
          type: string
        verdict:
          type: string
          enum: [pass, pending, fail]
        findings:
          type: string
        remediationCommit:
          type: string
          nullable: true
