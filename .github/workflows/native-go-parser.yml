name: Native Go parser package

on:  # yamllint disable-line rule:truthy
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-package:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install MinGW C compiler
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/gherkin_go/go.mod
      - name: Install package and test dependencies
        env:
          PYTEST_CUKE_BUILD_GO: "off"
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]" build uv
      - name: Build source distribution
        env:
          PYTEST_CUKE_BUILD_GO: "off"
        run: python -m build --sdist --outdir dist/source
      - name: Build native wheel from the source distribution
        env:
          PYTEST_CUKE_BUILD_GO: required
        shell: bash
        run: |
          python -c 'import glob, os, subprocess, sys; sdists = glob.glob("dist/source/pytest_cuke-*.tar.gz"); assert len(sdists) == 1, sdists; raise SystemExit(subprocess.call([sys.executable, "-m", "pip", "wheel", "--no-deps", "--wheel-dir", "dist/native", sdists[0]]))'
      - name: Verify pure and native installed consumers
        shell: bash
        run: |
          python -c 'import glob, os, subprocess, sys; wheels = glob.glob("dist/native/pytest_cuke-*.whl"); assert len(wheels) == 1, wheels; os.environ["PYTEST_CUKE_BUILD_GO"] = "off"; os.environ["PYTEST_CUKE_NATIVE_WHEEL"] = os.path.abspath(wheels[0]); raise SystemExit(subprocess.call([sys.executable, "-m", "pytest", "-q", "features/native-go-parser/optional-native-go-parser.feature"]))'
