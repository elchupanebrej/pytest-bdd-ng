name: Native Go parser package

on:  # yamllint disable-line rule:truthy
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  matrix-select:
    runs-on: ubuntu-latest
    outputs:
      cells: ${{ steps.native.outputs.cells }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install inventory reader
        run: python -m pip install "PyYAML==6.0.3"
      - id: native
        name: Select native parser cells from the environment inventory
        run: python scripts/env_matrix.py --job native-go-parser --github-output

  native-go-parser:
    needs: matrix-select
    runs-on: ${{ matrix.cell.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        cell: ${{ fromJSON(needs.matrix-select.outputs.cells) }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: "recursive"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.cell.python }}
      - name: Install MinGW C compiler
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/gherkin_go/go.mod
      - name: Install tox and inventory reader
        run: python -m pip install "tox>=4.2" "PyYAML==6.0.3"
      - name: Run the source-distribution native parser contract
        shell: bash
        run: python scripts/run_env_matrix_cell.py --job native-go-parser --cell "${{ matrix.cell.id }}" --sha "${{ github.sha }}" --output "artifacts/evidence-native-go-parser-${{ matrix.cell.id }}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-go-parser-proof-${{ matrix.cell.id }}-${{ github.sha }}
          path: artifacts/evidence-native-go-parser-${{ matrix.cell.id }}.json
          if-no-files-found: warn
