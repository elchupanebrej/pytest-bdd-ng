---
name: Main testing workflow

on:  # yamllint disable-line rule:truthy
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    timeout-minutes: 30
    strategy:
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
          - "pypy3.11"
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        exclude:
          - python-version: "3.10"
            os: windows-latest
          - python-version: "3.11"
            os: windows-latest
          - python-version: "3.12"
            os: windows-latest
          - python-version: "3.10"
            os: macos-latest
          - python-version: "3.11"
            os: macos-latest
          - python-version: "3.12"
            os: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "*"
      - name: Install pandoc
        uses: r-lib/actions/setup-pandoc@v2
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
      - name: Install npm dependencies
        run: |
          make env-install-npm
      - name: Test with tox
        run: |
          make tox
      - name: Generated messages schemas are up to date
        if: matrix.python-version == '3.14' && matrix.os == 'ubuntu-latest'
        run: |
          make check-message-schemas
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.14'
        with:
          fail_ci_if_error: false
      - name: Build checking
        if: "matrix.python-version == '3.14'"
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: |
          make dist-check
