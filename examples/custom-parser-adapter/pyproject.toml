[project]
name = "pytest-cuke-custom-parser-adapter"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["pytest-cuke>=2.3.1"]

[tool.uv.sources]
pytest-cuke = { path = "../..", editable = true }

[tool.pytest.ini_options]
testpaths = ["features"]
cuke_autoload = true
cuke_features_dir = "features"
