[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools", "wheel"]

[project]
authors = [
  {name = "Oleg Pidsadnyi", email = "oleg.pidsadnyi@gmail.com"},
  {name = "Anatoly Bubenkov", email = "bubenkoff@gmail.com"},
  {name = "Adam Coddington", email = "me@adamcoddington.net"},
  {name = "Albert-Jan Nijburg", email = "albertjan@curit.com"},
  {name = "Alessio Bogon", email = "youtux@gmail.com"},
  {name = "Andrey Makhnach", email = "andrey.makhnach@gmail.com"},
  {name = "Aron Curzon", email = "curzona@gmail.com"},
  {name = "Dmitrijs Milajevs", email = "dimazest@gmail.com"},
  {name = "Dmitry Kolyagin", email = "pauk-slon@users.noreply.github.com"},
  {name = "Florian Bruhin", email = "me@the-compiler.org"},
  {name = "Floris Bruynooghe", email = "flub@devork.be"},
  {name = "Harro van der Klauw", email = "hvdklauw@gmail.com"},
  {name = "Hugo van Kemenade", email = "hugovk@users.noreply.github.com"},
  {name = "Konstantin Goloveshko", email = "kostya.goloveshko@gmail.com"},
  {name = "Laurence Rowe", email = "l@lrowe.co.uk"},
  {name = "Leonardo Santagada", email = "santagada@github.com"},
  {name = "Milosz Sliwinski", email = "sliwinski.milosz@gmail.com"},
  {name = "Michiel Holtkamp", email = "github@elfstone.nl"},
  {name = "Robin Pedersen", email = "ropez@github.com"},
  {name = "Sergey Kraynev", email = "sergejyit@gmail.com"}
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: Pytest",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: MacOS :: MacOS X",
  "Topic :: Software Development :: Testing",
  "Topic :: Software Development :: Libraries",
  "Topic :: Utilities",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14"
]
dependencies = [
  "aiohttp",
  "attrs",
  "certifi",
  "chevron",
  "ci-environment",
  "cucumber-expressions",
  "cucumber-messages",
  "cucumber-tag-expressions",
  "decopatch",
  "docopt-ng",
  "filelock",
  "gherkin-official>=33",
  "importlib-metadata;python_version<'3.10.0'",
  "importlib-resources",
  "Jinja2",
  "jsonschema",
  "makefun",
  "ordered_set",
  "packaging",
  "parse",
  "parse_type>=0.6.0",
  "pathvalidate",
  "py",
  "pydantic>=2.0.3",
  "pytest>=7.0.0",
  "StrEnum;python_version<'3.11.0'",
  "typing-extensions;python_version<'3.11.0'"
]
description = "BDD for pytest"
license = {file = "LICENSE.rst"}
maintainers = [
  {name = "Konstantin Goloveshko", email = "kostya.goloveshko@gmail.com"}
]
name = "pytest-bdd-ng"
readme = {file = "README.rst", content-type = "text/x-rst"}
requires-python = ">=3.10"
version = "2.3.1"

[project.entry-points.pytest11]
"pytest-bdd-allure-logger" = "pytest_bdd.plugin.allure_logger.entrypoint"
"pytest-bdd-code-generator" = "pytest_bdd.plugin.code_generator.entrypoint"
"pytest-bdd-cucumber-formatter-json" = "pytest_bdd.plugin.cucumber_json_formatter:json_plugin"
"pytest-bdd-cucumber-formatter-junit" = "pytest_bdd.plugin.cucumber_junit:junit_plugin"
"pytest-bdd-cucumber-formatter-pretty" = "pytest_bdd.plugin.cucumber_pretty:pretty_plugin"
"pytest-bdd-cucumber-formatter-progress" = "pytest_bdd.plugin.cucumber_progress:progress_plugin"
"pytest-bdd-cucumber-formatter-progress-bar" = "pytest_bdd.plugin.cucumber_progress_bar:progress_bar_plugin"
"pytest-bdd-cucumber-formatter-snippets" = "pytest_bdd.plugin.cucumber_snippets:snippets_plugin"
"pytest-bdd-cucumber-formatter-summary" = "pytest_bdd.plugin.cucumber_summary:summary_plugin"
"pytest-bdd-cucumber-formatter-usage" = "pytest_bdd.plugin.cucumber_usage:usage_plugin"
"pytest-bdd-cucumber-formatter-usage-json" = "pytest_bdd.plugin.cucumber_usage_json:usage_json_plugin"
"pytest-bdd-cucumber-json" = "pytest_bdd.plugin.cucumber_json.entrypoint"
"pytest-bdd-gherkin-message-reporter" = "pytest_bdd.plugin.gherkin_message_reporter.entrypoint"
"pytest-bdd-gherkin-scenario-reporter" = "pytest_bdd.plugin.scenario_reporter.entrypoint"
"pytest-bdd-gherkin-terminal-reporter" = "pytest_bdd.plugin.gherkin_terminal_reporter.entrypoint"
"pytest-bdd-scenario-runner" = "pytest_bdd.plugin.pickle_runner.entrypoint"
"pytest-bdd-scenario-test-collector" = "pytest_bdd.plugin.scenario_test_collector.entrypoint"
"pytest-bdd-struct-bdd" = "pytest_bdd.plugin.struct_bdd.entrypoint"

[project.optional-dependencies]
allure = [
  "allure-python-commons",
  "allure-pytest"
]
doc-gen = [
  'docopt-ng',
  'pandoc',
  'panflute',
  'pathlib2',
  'pypandoc'
]
full = [
  "pytest-bdd-ng[allure]",
  "pytest-bdd-ng[doc-gen]",
  "pytest-bdd-ng[struct-bdd]",
  "pytest-bdd-ng[test]",
  "pytest-bdd-ng[test-playwright]",
  "pytest-bdd-ng[testtypes]"
]
struct-bdd = [
  "hjson",
  "json5",
  "pyhocon",
  'tomli;python_version<"3.11.0"',
  "PyYAML",
  "types-PyYAML"
]
test = [
  "allure-python-commons-test",
  "deepdiff",
  "execnet>=2.1.2",
  "GitPython",
  "jq;platform_system!='Windows'",
  "packaging",
  "PyHamcrest",
  "pytest-httpserver",
  "pytest-order",
  "pytest-xdist>=3.8.0",
  "python-coveralls",
  "pytest-bdd-ng[doc-gen];python_version>='3.13.0'",
  "ruff"
]
test-playwright = [
  "playwright"
]
testenv = [
  "tox~=4.0",
  "codecov"
]
testtypes = [
  "GitPython",
  "mypy",
  "types-certifi",
  "types-chevron",
  "types-docopt",
  "types-gunicorn",
  "types-jsonschema",
  "types-pathlib2",
  "types-pexpect",
  "types-Pygments",
  "types-setuptools"
]

[project.scripts]
bdd_tree_to_rst = "pytest_bdd.script.bdd_tree_to_rst:main"
compatibility_matrix = "pytest_bdd.script.compatibility_matrix:main"
render_cucumber_formatters = "pytest_bdd.script.render_cucumber_formatters:main"

[project.urls]
Documentation = "https://pytest-bdd-ng.readthedocs.io/en/default/"
Repository = "https://github.com/elchupanebrej/pytest-bdd-ng"

[tool.mypy]
check_untyped_defs = true
files = "src/pytest_bdd/**/*.py"
install_types = false
plugins = [
  "pydantic.mypy"
]
show_error_codes = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
ignore_missing_imports = true
module = [
  "allure_commons.*",
  "attr.*",
  "ci_environment.*",
  "cucumber_messages",
  "cucumber_messages.*",
  "cucumber_expressions.*",
  "cucumber_tag_expressions.*",
  "decopatch.*",
  "gherkin.*",
  "hjson",
  "json5",
  "makefun",
  "ordered_set",
  "parse",
  "parse_type.*",
  "pluggy.*",
  "_pytest.*",
  "pyhocon",
  "pytest.*",
  "xdist",
  "xdist.*",
  "yaml.*"
]

[[tool.mypy.overrides]]
check_untyped_defs = true
module = [
  "pytest_bdd.model.message_converter",
  "pytest_bdd.model.message_extension",
  "pytest_bdd.model.message_validation",
  "pytest_bdd.plugin.gherkin_message_reporter.*"
]

[tool.pytest.ini_options]
addopts = "-p pytester --order-scope=session"
bdd_features_base_dir = "features/"
filterwarnings = [
  "error",
  "ignore::DeprecationWarning",
  "ignore::ImportWarning"
]
markers = [
  "deprecated: mark test testing deprecated API",
  "deficient: mark test with non-full coverage",
  "docker: mark tests that require Docker-backed environments",
  "instant: smallest in-process tests",
  "fast: normal fast tests",
  "medium: moderate integration tests",
  "slow: expensive local tests",
  "external: tests requiring external services",
  "slow: mark tests that are intentionally excluded from short/default runs",
  "playwright: mark browser-backed acceptance tests",
  "surplus: mark test testing non-standard API",
  "technical_nonconvertible: mark technical regression tests that must remain in pytest suite",
  "xdist: mark tests that exercise pytest-xdist/distributed execution flows",
  "order: execution ordering marker from pytest-order"
]
test_group_default = "fast"
test_group_order = ["instant", "fast", "medium", "slow", "external"]
test_group_paths = [
  "tests/unit/** = instant",
  "tests/model/** = instant",
  "tests/args/** = fast",
  "tests/hook/** = fast",
  "tests/steps/** = fast",
  "tests/feature/** = medium",
  "tests/gherkin_integration/** = medium",
  "tests/library/** = medium",
  "tests/struct_bdd/** = medium",
  "tests/allure_/** = slow",
  "tests/compatibility/** = slow",
  "tests/contract/** = slow",
  "tests/doc/** = slow",
  "tests/generation/** = slow",
  "tests/messages/** = slow",
  "tests/messages_coverage/** = slow",
  "tests/scripts/** = slow",
  "tests/e2e/** = external"
]
testpaths = ["tests"]

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
  ".eggs",
  ".git",
  ".git-rewrite",
  ".mypy_cache",
  ".ruff_cache",
  ".tox",
  ".venv",
  "__pypackages__",
  "build",
  "dist",
  "venv"
]
# Same as Black.
line-length = 120
# Assume Python 3.10+
target-version = "py310"

[tool.ruff.format]
# Like Black, indent with spaces, rather than tabs.
indent-style = "space"
# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"
# Like Black, use double quotes for strings.
quote-style = "double"
# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

[tool.ruff.lint]
# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"
# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
ignore = [
  "COM812",  # missing-trailing - comma - Linter-Formatter interference - ~369 errors
  "CPY001",  # missing-copyright - notice - Requires mass header insertion - ~335 errors
  "D100",  # undocumented-public - module - Legacy/Noisy - ~121 errors
  "D101",  # undocumented-public - class - Legacy/Noisy - ~210 errors
  "D102",  # undocumented-public - method - Legacy/Noisy - ~373 errors
  "D103",  # undocumented-public - function - Legacy/Noisy - ~210 errors
  "D104",  # undocumented-public - package - Legacy/Noisy - ~24 errors
  "D106",  # undocumented-public - nested-class - Legacy/Noisy - ~18 errors
  "D107",  # undocumented-public - init - Legacy/Noisy - ~43 errors
  "D212",  # multi-line - summary-first-line - Conflicts with active D213 convention
  "DOC201",  # docstring-missing - returns - Legacy/Noisy - ~73 errors
  "FIX002",  # line-contains - todo - Legacy/Noisy - ~14 errors
  "PLC0415",  # import-outside - top-level - Legacy/Noisy - ~66 errors
  "PLC2701",  # import-private - name - Legacy/Noisy - ~31 errors
  "PLR0904",  # too-many - public-methods - Legacy/Noisy - ~2 errors
  "PLR0911",  # too-many - return-statements - Legacy/Noisy - ~6 errors
  "PLR0912",  # too-many - branches - Legacy/Noisy - ~5 errors
  "PLR0913",  # too-many - arguments - Legacy/Noisy - ~27 errors
  "PLR0914",  # too-many - locals - Legacy/Noisy - ~7 errors
  "PLR0915",  # too-many - statements - Legacy/Noisy - ~4 errors
  "PLR0917",  # too-many - positional-arguments - Legacy/Noisy - ~15 errors
  "PLR1702",  # too-many - nested-blocks - Requires control-flow refactor
  "PLR2004",  # magic-value - comparison - Legacy/Noisy - ~12 errors
  "PLR6301",  # no-self - use - Legacy/Noisy - ~104 errors
  "PLW0603",  # global-statement - Legacy/Noisy - ~1 errors
  "SLF001",  # private-member - access - Legacy/Noisy - ~207 errors
  "TC006",  # runtime-cast - value - PyCharm cast string bug - ~206 errors
  "TD002",  # missing-todo - author - Legacy/Noisy - ~14 errors
  "TD003",  # missing-todo - link - Legacy/Noisy - ~14 errors
  "TD004",  # missing-todo - colon - Legacy/Noisy - ~9 errors
]
preview = true
select = [
  "A",  # flake8-builtins: Built-in names shadowed
  "ANN",  # flake8-annotations: Annotations
  "ARG",  # flake8-unused-arguments: Unused function arguments
  "ASYNC",  # flake8-async: Asyncio
  "B",  # flake8-bugbear: Likely bugs and design problems
  "BLE",  # blind-except: Blind excepts
  "C4",  # flake8-comprehensions: Comprehension optimizations
  "C90",  # flake8-c90: C90 style issues
  "COM",  # flake8-commas: Comma issues
  "CPY",  # flake8-copyright: Copyright headers
  "D",  # pydocstyle: Docstring conventions
  "DTZ",  # flake8-datetimez: Datetime issues
  "DOC",  # pydoclint: Docstring linting
  "E",  # pycodestyle errors: Style guide enforcement
  "EXE",  # flake8-executable: Executable scripts
  "EM",  # flake8-errmsg: Error message consistency
  "ERA",  # eradicate: Remove commented-out code
  "F",  # Pyflakes: Logical errors, undefined names
  "FA",  # flake8-future-annotations: Future annotations
  "FBT",  # flake8-boolean-trap: Boolean trap
  "FIX",  # flake8-fixme: Fixme comments
  "FLY",  # flynt: String formatting modernization
  "FURB",  # refurb: Code modernization
  "G",  # flake8-logging-format: Logging format issues
  "I",  # isort: Import sorting
  "ICN",  # flake8-import-conventions: Import conventions
  "INT",  # flake8-gettext: Gettext usage
  "INP",  # flake8-no-pep420: PEP 420 namespace packages
  "ISC",  # flake8-implicit-str-concat: Implicit string concatenation
  "LOG",  # flake8-logging: Logging issues
  "N",  # pep8-naming: Naming conventions
  "PERF",  # perflint: Performance issues
  "PGH",  # pygrep-hooks: Pre-commit hooks
  "PIE",  # flake8-pie: Miscellaneous checks
  "PL",  # pylint: Linting
  "PT",  # flake8-pytest-style: Pytest style
  "PTH",  # flake8-use-pathlib: Use pathlib
  "PYI",  # flake8-pyi: Pyi file checks
  "RET",  # flake8-return: Return statement checks
  "RSE",  # flake8-raise: Raise statement checks
  "RUF",  # ruff: Ruff-specific checks
  "S",  # bandit: Security issues
  "SIM",  # flake8-simplify: Simplifiable code
  "SLF",  # flake8-self: Private member access
  "SLOT",  # flake8-slots: Slots usage
  "T10",  # flake8-debugger: Debugger usage
  "T20",  # flake8-print: Print statement usage
  "TC",  # flake8-type-checking: Type checking
  "TD",  # flake8-todos: TODO comments
  "TID",  # flake8-tidy-imports: Import restrictions
  "TRY",  # tryceratops: Try/except issues
  "YTT",  # flake8-2020: Outdated sys.version checks
  "W",  # pycodestyle warnings: Style guide warnings
  "UP",  # pyupgrade: Modernize syntax for newer Python versions
  "Q"  # flake8-quotes: String quote consistency
]
unfixable = []

[tool.ruff.lint.isort]
# Like isort, sort imports using a single line after the import block.
force-single-line = false
# Like isort, separate sections with a blank line.
section-order = [
  "future",
  "standard-library",
  "third-party",
  "first-party",
  "local-folder"
]

[tool.ruff.lint.mccabe]
# Flag errors (`C901`) whenever the complexity level exceeds.
max-complexity = 10  # TODO target is 6

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # F401: ~2 errors
"docs/conf.py" = ["ERA001"]  # ERA001: ~40 errors
"docs/tutorial/tests/*" = ["S101"]  # S101: ~2 errors
"src/pytest_bdd/compatibility/allure.py" = ["ERA001"]  # TODO re-implement Allure plugin - ERA001: ~3 errors
"src/pytest_bdd/compatibility/pytest/__init__.py" = ["RUF"]  # RUF: ~16 errors
"src/pytest_bdd/plugin/allure_logger/entrypoint.py" = ["ERA001"]  # TODO re-implement Allure plugin - ERA001: ~11 errors
"src/pytest_bdd/util/toolz_test.py" = ["S301"]  # S301: ~1 errors
"tests/*" = ["ANN", "D", "EM101", "PLR0913", "PLR0914", "PLR0915", "PLR0917", "PLR2004", "S101", "S506"]  # ANN: ~885 errors, D: ~908 errors, EM101: ~4 errors, PLR0913: ~6 errors, PLR0914: ~3 errors, PLR0915: ~3 errors, PLR0917: ~2 errors, PLR2004: ~43 errors, S101: ~1582 errors, S506: ~9 errors
"tests/e2e/test_xdist_remote_message_aggregation.py" = ["S603"]  # e2e test intentionally starts fixed local execnet socket servers. - S603: ~2 errors

[tool.ruff.lint.pyupgrade]
# Preserve types, even if a file imports `from __future__ import annotations`.
keep-runtime-typing = true

[tool.setuptools]
include-package-data = true
package-dir = {"" = "src"}

[tool.setuptools.package-data]
pytest_bdd = [
  "markdown_parser.js"
]
"pytest_bdd.model" = [
  "message_jsonschema/*.json"
]
"pytest_bdd.plugin.gherkin_message_reporter.resources.templates" = [
  "live_formatter_bridge.mjs.j2",
  "formatter_adapter_support.cjs.j2"
]
"pytest_bdd.plugin.gherkin_message_reporter.resources.templates.formatters" = [
  "pretty.cjs.j2",
  "progress.cjs.j2",
  "progress_bar.cjs.j2",
  "usage.cjs.j2",
  "junit.cjs.j2"
]
"pytest_bdd.template" = [
  "feature_include.rst.jinja2",
  "features_index.rst.jinja2",
  "features_section.rst.jinja2",
  "test.py.jinja2"
]

[tool.setuptools.packages.find]
namespaces = false
where = [
  "src"
]
