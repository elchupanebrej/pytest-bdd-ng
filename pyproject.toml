[tool.ruff.lint.pyupgrade]
# Preserve types, even if a file imports `from __future__ import annotations`.
keep-runtime-typing = true

[tool.setuptools]
include-package-data = true
package-dir = {"" = "src"}

[tool.setuptools.cmdclass]
build_go = "pytest_bdd._gherkin_go._build.BuildGoCommand"

[tool.setuptools.package-data]
pytest_bdd = [
  "markdown_parser.js",
  "py.typed"
]
"pytest_bdd._gherkin_go" = [
  "*.so",
  "*.dll",
  "*.dylib"
]
"pytest_bdd.model" = [
  "message_jsonschema/*.json"
]
"pytest_bdd.plugin.gherkin_message_reporter.resources.templates" = [
  "live_formatter_bridge.mjs.j2",
  "formatter_adapter_support.cjs.j2"
]
"pytest_bdd.plugin.gherkin_message_reporter.resources.templates.formatters" = [
  "pretty.cjs.j2",
  "progress.cjs.j2",
  "progress_bar.cjs.j2",
  "usage.cjs.j2",
  "junit.cjs.j2"
]
"pytest_bdd.template" = [
  "test.py.jinja2"
]
"pytest_bdd_testing" = [
  "resources/templates/cucumber_formatters/*.j2"
]
stubs = [
  "**/*.pyi",
  "py.typed"
]

[tool.setuptools.packages.find]
exclude = ["pytest_bdd_testing*"]
namespaces = false
where = [
  "src"
]

[tool.vulture]
ignore_names = [
  "AttrsInstance",
  "CfparseParser",
  "CodeType",
  "CucumberExpressionParser",
  "FrameType",
  "FunctionType",
  "GherkinDocumentWithURI",
  "Match",
  "MethodType",
  "ReParser",
  "StringParser",
  "TOMLDecodeError",
  "TracebackType",
  "Traversable",
  "_FixtureCaller",
  "_ParseMatchProtocol",
  "_RegexCompiler",
  "_StepCaller",
  "basetemp",
  "controller",
  "event",
  "fixturefunc",
  "fixturemanager",
  "manager",
  "module_path",
  "nextitem"
]
min_confidence = 80
paths = [
  "src/pytest_bdd"
]
