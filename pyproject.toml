[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools", "wheel"]

[project]
authors = [
  {name = "Oleg Pidsadnyi", email = "oleg.pidsadnyi@gmail.com"},
  {name = "Anatoly Bubenkov", email = "bubenkoff@gmail.com"},
  {name = "Adam Coddington", email = "me@adamcoddington.net"},
  {name = "Albert-Jan Nijburg", email = "albertjan@curit.com"},
  {name = "Alessio Bogon", email = "youtux@gmail.com"},
  {name = "Andrey Makhnach", email = "andrey.makhnach@gmail.com"},
  {name = "Aron Curzon", email = "curzona@gmail.com"},
  {name = "Dmitrijs Milajevs", email = "dimazest@gmail.com"},
  {name = "Dmitry Kolyagin", email = "pauk-slon@users.noreply.github.com"},
  {name = "Florian Bruhin", email = "me@the-compiler.org"},
  {name = "Floris Bruynooghe", email = "flub@devork.be"},
  {name = "Harro van der Klauw", email = "hvdklauw@gmail.com"},
  {name = "Hugo van Kemenade", email = "hugovk@users.noreply.github.com"},
  {name = "Konstantin Goloveshko", email = "kostya.goloveshko@gmail.com"},
  {name = "Laurence Rowe", email = "l@lrowe.co.uk"},
  {name = "Leonardo Santagada", email = "santagada@github.com"},
  {name = "Milosz Sliwinski", email = "sliwinski.milosz@gmail.com"},
  {name = "Michiel Holtkamp", email = "github@elfstone.nl"},
  {name = "Robin Pedersen", email = "ropez@github.com"},
  {name = "Sergey Kraynev", email = "sergejyit@gmail.com"}
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: Pytest",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: MacOS :: MacOS X",
  "Topic :: Software Development :: Testing",
  "Topic :: Software Development :: Libraries",
  "Topic :: Utilities",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14"
]
dependencies = [
  "aiohttp",
  "attrs",
  "certifi",
  "chevron",
  "ci-environment",
  # This upstream binding includes the run-hook payloads used by the reporting lifecycle.
  "cucumber-messages==28.0.0",
  "cucumber-expressions",
  "decopatch",
  "docopt-ng",
  "filelock",
  "gherkin-official>=24,<34",
  "importlib-metadata;python_version<'3.10.0'",
  "importlib-resources",
  "jsonschema>=4.18",
  "makefun",
  "Mako",
  "ordered_set",
  "packaging",
  "parse",
  "parse_type>=0.6.0",
  "pathvalidate",
  "py",
  "pydantic>=2.0.3",
  "referencing>=0.30",
  "tomli;python_version<'3.11.0'",
  "pytest>=7.0",
  "cucumber-tag-expressions",
  "typing-extensions;python_version<'3.11.0'"
]
description = "BDD for pytest"
license = {file = "LICENSE.rst"}
maintainers = [
  {name = "Konstantin Goloveshko", email = "kostya.goloveshko@gmail.com"}
]
name = "pytest-cuke"
readme = {file = "README.rst", content-type = "text/x-rst"}
requires-python = ">=3.10"
version = "2.3.1"

[project.entry-points.pytest11]
cuke = "pytest_cuke.plugin"

[project.scripts]
pytest-cuke = "pytest_cuke.cli:main"
cuke = "pytest_cuke.cli:main"

[project.entry-points."pytest_cuke.formatters"]
cucumber-json = "pytest_cuke.cucumber_json_formatter:replay_cucumber_json_formatter_request"
cucumber-junit = "pytest_cuke.cucumber_junit_formatter:replay_cucumber_junit_formatter_request"


[project.optional-dependencies]
lint = [
  "ruff>=0.4.0",
  "vulture>=2.11",
  "deptry>=0.16.0",
  "bandit>=1.7.8",
  "pip-audit>=2.7.0"
]
pyright = [
  "pyright==1.1.414"
]
testtypes = [
  "attrs==26.1.0",
  "mypy==2.3.1",
  "pydantic==2.12.5",
  "tomli==2.2.1",
  "types-PyYAML==6.0.12.20260906",
  "allure-python-commons==2.16.2",
  "allure-pytest==2.16.2",
  "hjson==3.1.0",
  "json5==0.15.0",
  "pyhocon==0.3.63",
  "PyYAML==6.0.3"
]
test = [
  "pytest>=7.0.0",
  "attrs>=22.2.0"
]
env-matrix = [
  "PyYAML==6.0.3",
  "tox>=4.2"
]
test-playwright = [
  "playwright>=1.50,<2"
]
mutation = [
  "mutmut>=3.0.0"
]
allure = [
  "allure-python-commons",
  "allure-pytest"
]
debug-mcp = [
  "mcp-pdb>=0.6,<0.7",
  "mcp>=1.9,<2",
  "uvicorn>=0.34"
]
doc-gen = [
  'docopt-ng',
  'pandoc',
  'panflute',
  'pycmarkgfm',
  'pypandoc'
]
struct-bdd = [
  "hjson",
  "json5",
  "pyhocon",
  "PyYAML",
  "types-PyYAML"
]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = [
  "E", "F", "B", "UP", "SIM", "I", "C4", "RET", "TCH", "RUF",
  "PL",
  "S"
]
ignore = [
  "S101",
  "PLR0913",
  "PLR0917",
  "PLR0912",
  "PLR0915",
  "PLR2004"
]

[tool.ruff.lint.isort]
known-first-party = ["pytest_cuke"]

[tool.ruff.lint.per-file-ignores]
"docs/**" = ["ALL"]
"tests/**" = [
  "PLR2004",
  "S",
  "ARG001",
  "ARG002",
  "PLC0415",
  "PLW1641",
  "TCH",
  "B015",
  "SIM117",
  "E501",
  "UP",
  "B905",
  "RET504",
  "I001",
  "RUF101",
  "RUF100",
  "RUF001",
  "RUF002",
  "RUF003",
  "RUF021",
  "F541",
  "C4",
  "E402",
]
"src/*/plugin.py" = ["ARG001"]
"src/pytest_cuke/compatibility/**" = ["TCH", "C4", "RET", "PLR", "SIM", "UP"]
"src/pytest_cuke/struct_bdd/**" = ["PLC0415", "TCH", "ARG001", "ARG002"]
"src/pytest_cuke/script/**" = ["RET503", "PLC0415"]
"src/pytest_cuke/utils.py" = ["PLC0415"]
"src/pytest_cuke/webloc.py" = ["C408"]

[tool.pyright]
include = ["src"]
exclude = ["**/__pycache__"]
pythonVersion = "3.10"
typeCheckingMode = "strict"
reportUnknownMemberType = "warning"
reportMissingTypeStubs = "none"

[tool.deptry]
known_first_party = ["pytest_cuke"]

[tool.deptry.package_module_name_map]
allure-python-commons = "allure_commons"
allure-pytest = "allure_pytest"
cucumber-messages = "cucumber_messages"
cucumber-expressions = "cucumber_expressions"
cucumber-tag-expressions = "cucumber_tag_expressions"
gherkin-official = "gherkin"
PyYAML = "yaml"
types-PyYAML = "types_pyyaml"

[tool.deptry.per_rule_ignores]
DEP001 = ["allure_commons", "strenum", "tomllib"]
DEP002 = [
  "aiohttp",
  "certifi",
  "chevron",
  "ci-environment",
  "decopatch",
  "filelock",
  "importlib-metadata",
  "importlib-resources",
  "makefun",
  "Mako",
  "ordered_set",
  "parse",
  "parse_type",
  "py",
  "ruff",
  "vulture",
  "deptry",
  "bandit",
  "pip-audit",
  "pyright",
  "mypy",
  "mutmut",
  "pandoc",
  "types-PyYAML",
]
DEP003 = ["pluggy", "tomli"]

[tool.mutmut]
mutate_only_covered_lines = true

[tool.mypy]
python_version = "3.10"
files = ["src/pytest_cuke"]
strict = true
disallow_untyped_defs = true
disallow_untyped_calls = true
disallow_any_generics = true
plugins = ["pydantic.mypy"]
warn_unused_configs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
  "cucumber_messages", "cucumber_messages.*",
  "gherkin", "gherkin.*",
  "cucumber_expressions", "cucumber_expressions.*",
  "cucumber_tag_expressions", "cucumber_tag_expressions.*",
  "parse", "parse_type", "parse_type.*",
  "mako", "mako.*",
  "allure_commons", "allure_commons.*",
  "allure_pytest", "allure_pytest.*",
  "ci_environment", "chevron"
]
follow_untyped_imports = true

[tool.pytest-cuke.typecheck]
checker_version = "2.3.1"
source_scope = "src/pytest_cuke"
required_distributions = [
  "attrs==26.1.0",
  "pydantic==2.12.5",
  "tomli==2.2.1",
  "types-PyYAML==6.0.12.20260906",
]

[tool.pytest-cuke.compatibility]
python-factors = ["3.10", "3.11", "3.12", "3.13", "3.14"]
pytest-factors = ["7.0", "8.0", "9.0", "latest"]
execution-targets = ["lin", "mac", "win"]
tox-env-template = "py{python}-pytest{pytest}-coverage-{target}"
compatibility-source = "pytest-official-policy-and-release-notes"

[tool.pytest-cuke.migration-audit]
feature-patterns = ["features/**/*.feature", "features/**/*.gherkin", "features/**/*.feature.md", "features/**/*.gherkin.md"]
test-registration-patterns = ["tests/**/*.py"]
threshold-percent = 80

[tool.pytest.ini_options]
testpaths = ["tests", "features"]
addopts = ["-m", "not typecheck and not doc_gen"]
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore::ImportWarning",
  "ignore::pytest.PytestConfigWarning"
]
markers = [
  "unit: Unit tests",
  "integration: Integration tests",
  "contract: Contract tests",
  "e2e: End-to-end tests",
  "external: External integration tests",
  "typecheck: Strict runtime-source Mypy acceptance probes",
  "doc_gen: Tests that require optional documentation-generation dependencies and Pandoc"
]
cuke_autoload = true
cuke_features_dir = "features"
cuke_strict = false
cuke_liberal_steps = false
cuke_json = ""
cuke_junit = ""
cuke_messages_ndjson = ""
cuke_html = ""
cuke_progress = false
cuke_progress_bar = false
cuke_snippets = false
cuke_summary = false
