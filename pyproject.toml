[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools", "wheel"]

[dependency-groups]
dev = [
  "astroid>=3.3",
  "pylint>=3.3",
  "pytest-cov>=7.1.0"
]

[project]
authors = [
  {name = "Oleg Pidsadnyi", email = "oleg.pidsadnyi@gmail.com"},
  {name = "Anatoly Bubenkov", email = "bubenkoff@gmail.com"},
  {name = "Adam Coddington", email = "me@adamcoddington.net"},
  {name = "Albert-Jan Nijburg", email = "albertjan@curit.com"},
  {name = "Alessio Bogon", email = "youtux@gmail.com"},
  {name = "Andrey Makhnach", email = "andrey.makhnach@gmail.com"},
  {name = "Aron Curzon", email = "curzona@gmail.com"},
  {name = "Dmitrijs Milajevs", email = "dimazest@gmail.com"},
  {name = "Dmitry Kolyagin", email = "pauk-slon@users.noreply.github.com"},
  {name = "Florian Bruhin", email = "me@the-compiler.org"},
  {name = "Floris Bruynooghe", email = "flub@devork.be"},
  {name = "Harro van der Klauw", email = "hvdklauw@gmail.com"},
  {name = "Hugo van Kemenade", email = "hugovk@users.noreply.github.com"},
  {name = "Konstantin Goloveshko", email = "kostya.goloveshko@gmail.com"},
  {name = "Laurence Rowe", email = "l@lrowe.co.uk"},
  {name = "Leonardo Santagada", email = "santagada@github.com"},
  {name = "Milosz Sliwinski", email = "sliwinski.milosz@gmail.com"},
  {name = "Michiel Holtkamp", email = "github@elfstone.nl"},
  {name = "Robin Pedersen", email = "ropez@github.com"},
  {name = "Sergey Kraynev", email = "sergejyit@gmail.com"}
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: Pytest",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: MacOS :: MacOS X",
  "Topic :: Software Development :: Testing",
  "Topic :: Software Development :: Libraries",
  "Topic :: Utilities",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14"
]
dependencies = [
  "aiohttp",
  "attrs",
  "certifi",
  "chevron",
  "ci-environment",
  "cucumber-expressions",
  "cucumber-messages",
  "cucumber-tag-expressions",
  "decopatch",
  "filelock",
  "gherkin-official>=33",
  "importlib-metadata;python_version<'3.10.0'",
  "importlib-resources",
  "Jinja2",
  "jsonschema",
  "makefun",
  "ordered_set",
  "packaging",
  "parse",
  "parse_type>=0.6.0",
  "pathvalidate",
  "py",
  "pydantic>=2.0.3",
  "pytest>=7.0.0",
  "returns",
  "ruff",
  "StrEnum;python_version<'3.11.0'",
  "typing-extensions;python_version<'3.11.0'"
]
description = "BDD for pytest"
license = {file = "LICENSE.md"}
maintainers = [
  {name = "Konstantin Goloveshko", email = "kostya.goloveshko@gmail.com"}
]
name = "pytest-bdd-ng"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.10"
version = "2.3.1"

[project.entry-points.pytest11]
# --- CODE-GEN (extra: code-gen) ---
# code_generator: Test code generation from feature files
"pytest-bdd-code-generator" = "pytest_bdd.plugin.code_generator.entrypoint"
# --- FORMATTERS (extra: formatters) ---
# cucumber_json_formatter: Cucumber JSON output formatter
"pytest-bdd-cucumber-formatter-json" = "pytest_bdd.plugin.cucumber_json_formatter.entrypoint:json_plugin"
# cucumber_junit: JUnit XML output formatter
"pytest-bdd-cucumber-formatter-junit" = "pytest_bdd.plugin.cucumber_junit.entrypoint:junit_plugin"
# cucumber_pretty: Pretty terminal output formatter
"pytest-bdd-cucumber-formatter-pretty" = "pytest_bdd.plugin.cucumber_pretty.entrypoint:pretty_plugin"
# cucumber_progress: Progress indicator formatter
"pytest-bdd-cucumber-formatter-progress" = "pytest_bdd.plugin.cucumber_progress.entrypoint:progress_plugin"
# cucumber_progress_bar: Alternative progress bar formatter
"pytest-bdd-cucumber-formatter-progress-bar" = "pytest_bdd.plugin.cucumber_progress_bar.entrypoint:progress_bar_plugin"
# cucumber_snippets: Step snippet generator for undefined steps
"pytest-bdd-cucumber-formatter-snippets" = "pytest_bdd.plugin.cucumber_snippets.entrypoint:snippets_plugin"
# cucumber_summary: Summary output formatter
"pytest-bdd-cucumber-formatter-summary" = "pytest_bdd.plugin.cucumber_summary.entrypoint:summary_plugin"
# cucumber_usage: Step usage statistics formatter
"pytest-bdd-cucumber-formatter-usage" = "pytest_bdd.plugin.cucumber_usage.entrypoint:usage_plugin"
# cucumber_usage_json: JSON step usage statistics formatter
"pytest-bdd-cucumber-formatter-usage-json" = "pytest_bdd.plugin.cucumber_usage_json.entrypoint:usage_json_plugin"
# cucumber_json: Cucumber JSON reporter (NDJSON stream)
"pytest-bdd-cucumber-json" = "pytest_bdd.plugin.cucumber_json.entrypoint"
# cucumber_json_dispatcher: JSON message dispatcher
"pytest-bdd-cucumber-json-dispatcher" = "pytest_bdd.plugin.cucumber_json_dispatcher.entrypoint"
# gherkin_message_reporter: live reporting bridge, NDJSON message transport
"pytest-bdd-gherkin-message-reporter" = "pytest_bdd.plugin.gherkin_message_reporter.entrypoint"
# scenario_reporter: Scenario-level reporting events
"pytest-bdd-gherkin-scenario-reporter" = "pytest_bdd.plugin.scenario_reporter.entrypoint"
# gherkin_terminal_reporter: Terminal reporter for gherkin output
"pytest-bdd-gherkin-terminal-reporter" = "pytest_bdd.plugin.gherkin_terminal_reporter.entrypoint"
# pickle_runner: scenario execution runtime, step dispatch, lifecycle state machine
"pytest-bdd-scenario-runner" = "pytest_bdd.plugin.pickle_runner.entrypoint"
# --- CORE (always loaded, no opt-out) ---
# scenario_test_collector: feature collection, test generation, step matching hook
"pytest-bdd-scenario-test-collector" = "pytest_bdd.plugin.scenario_test_collector.entrypoint"
# --- STRUCT-BDD (extra: struct-bdd) ---
# struct_bdd: YAML/JSON/HOCON/TOML feature definition parser and plugin
"pytest-bdd-struct-bdd" = "pytest_bdd.plugin.struct_bdd.entrypoint"

[project.optional-dependencies]
allure = [
  "allure-python-commons"
]
async = [
  "aiofiles"
]
code-gen = []
doc-gen = [
  'sphinx>=7.0',
  'sphinxcontrib-mermaid',
  'myst-parser'
]
formatters = []
full = [
  "pytest-bdd-ng[allure]",
  "pytest-bdd-ng[async]",
  "pytest-bdd-ng[code-gen]",
  "pytest-bdd-ng[doc-gen]",
  "pytest-bdd-ng[formatters]",
  "pytest-bdd-ng[struct-bdd]",
  "pytest-bdd-ng[test]",
  "pytest-bdd-ng[test-playwright]",
  "pytest-bdd-ng[testtypes]"
]
go-parser = []
struct-bdd = [
  "hjson",
  "json5",
  "pyhocon",
  'tomli;python_version<"3.11.0"',
  "PyYAML",
  "types-PyYAML"
]
test = [
  "deepdiff",
  "execnet>=2.1.2",
  "GitPython",
  "jq;platform_system!='Windows'",
  "packaging",
  "PyHamcrest",
  "pytest-httpserver",
  "pytest-order",
  "pytest-timeout",
  "pytest-xdist>=3.8.0",
  "python-coveralls",
  "pytest-bdd-ng[struct-bdd]",
  "pytest-bdd-ng[doc-gen];python_version>='3.13.0'"
]
test-playwright = [
  "playwright"
]
testenv = [
  "tox~=4.0",
  "codecov"
]
testtypes = [
  "GitPython",
  "mypy",
  "types-certifi",
  "types-chevron",
  "types-gunicorn",
  "types-jsonschema",
  "types-pexpect",
  "types-Pygments",
  "types-setuptools"
]

[project.scripts]
compatibility_matrix = "pytest_bdd.script.compatibility_matrix:main"
render_cucumber_formatters = "pytest_bdd.script.render_cucumber_formatters:main"

[project.urls]
Documentation = "https://pytest-bdd-ng.readthedocs.io/en/default/"
Repository = "https://github.com/elchupanebrej/pytest-bdd-ng"

[tool.mypy]
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_untyped_defs = true
exclude = [
  "^src/pytest_bdd_testing/"
]
extra_checks = true
install_types = false
local_partial_types = true
mypy_path = "src, stubs"
no_implicit_reexport = true
packages = ["pytest_bdd"]
plugins = [
  "pydantic.mypy"
]
python_version = "3.14"
show_error_codes = true
strict_bytes = true
strict_equality = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
check_untyped_defs = true
module = [
  "pytest_bdd.model.message_converter",
  "pytest_bdd.model.message_extension",
  "pytest_bdd.model.message_validation",
  "pytest_bdd.plugin.gherkin_message_reporter.*"
]

[[tool.mypy.overrides]]
implicit_reexport = true
module = [
  "pytest_bdd.compatibility",
  "pytest_bdd.compatibility.*",
  "pytest_bdd.message_stream_validation.facade",
  "pytest_bdd.model.message_validation",
  "pytest_bdd.model.run.lifecycle.facade",
  "pytest_bdd.parsers.facade",
  "pytest_bdd.plugin.gherkin_message_reporter.lifecycle_runtime.facade",
  "pytest_bdd.plugin.gherkin_message_reporter.live_formatter_runtime",
  "pytest_bdd.plugin.gherkin_message_reporter.session",
  "pytest_bdd.plugin.gherkin_message_reporter.standalone_renderer",
  "pytest_bdd.plugin.gherkin_message_reporter.step_catalog_runtime.facade",
  "pytest_bdd.plugin.pickle_runner.plugin.facade",
  "pytest_bdd.plugin.struct_bdd.model.facade",
  "pytest_bdd.scenario_locator.facade",
  "pytest_bdd.script.message_capability_governance.cli.facade",
  "pytest_bdd.util.tests_group_ordering.facade"
]

[tool.pylint.main]
load-plugins = ["pytest_bdd._pylint"]

[tool.pylint.messages_control]
disable = [
  # Handled by Ruff / Formatter / mypy
  "line-too-long",
  "missing-docstring",
  "unused-import",
  "unused-variable",
  "unused-argument",
  "redefined-outer-name",
  "redefined-builtin",
  "undefined-variable",
  "wildcard-import",
  "unused-wildcard-import",
  "invalid-name",
  "bad-indentation",
  "mixed-line-endings",
  "missing-final-newline",
  "superfluous-parens",
  "too-many-instance-attributes",
  "too-many-arguments",
  "too-many-locals",
  "too-many-statements",
  "too-many-branches",
  "too-many-return-statements",
  "too-many-public-methods",
  "too-many-boolean-expressions",
  "too-many-nested-blocks",
  "too-many-positional-arguments",
  "comparison-with-itself",
  "useless-else-on-loop",
  "unnecessary-pass",
  "unnecessary-lambda",
  "no-else-return",
  "no-else-raise",
  "no-else-break",
  "no-else-continue",
  "simplifiable-if-expression",
  "simplifiable-if-statement",
  "useless-object-inheritance",
  "useless-return",
  "consider-using-dict-comprehension",
  "consider-using-set-comprehension",
  "consider-using-in",
  "consider-using-sys-exit",
  "consider-using-enumerate",
  "consider-using-f-string",
  "singleton-comparison",
  "unidiomatic-typecheck",
  "use-maxsplit-arg",
  "use-dict-literal",
  "use-implicit-booleaness-not-len",
  "useless-import-alias",
  "import-outside-toplevel",
  "empty-docstring",
  "bare-except",
  "broad-except",
  "pointless-statement",
  "pointless-string-statement",
  "expression-not-assigned",
  "eval-used",
  "exec-used",
  "logging-format-interpolation",
  "logging-not-lazy",
  "logging-fstring-interpolation",
  "unnecessary-comprehension",
  "nested-min-max",
  "bidirectional-unicode",
  "invalid-character-backspace",
  "wrong-import-position",
  "wrong-import-order",
  "ungrouped-imports",
  "global-statement",
  "super-init-not-called",
  "protected-access",
  "import-self",
  "reimported",
  "duplicate-code",
  "no-name-in-module",
  "too-few-public-methods",
  "too-many-ancestors",
  "non-parent-init-called",
  "attribute-defined-outside-init",
  "fixme",
  "unnecessary-ellipsis",
  "abstract-method",
  "disallowed-name",
  "use-implicit-booleaness-not-comparison",
  "subprocess-run-check",
  "too-many-lines",
  "comparison-with-callable",
  "no-member",
  "file-too-long"
]
enable = [
  "missing-responsibility-doc",
  "short-responsibility-doc",
  "legacy-responsibility-doc",
  "missing-architecture-score",
  "unfilled-responsibility-placeholder",
  "no-return-none",
  "bare-except-exception",
  "no-test-class",
  "bare-type-ignore",
  "missing-type-ignore-explanation",
  "multiple-responsibility-clusters",
  "downward-import",
  "horizontal-import",
  "empty-init",
  "redundant-import-alias",
  "docstring-only-init",
  "test-import-outside-cases",
  "bare-noqa",
  "missing-noqa-explanation"
]

[tool.pylint.similarities]
ignore-comments = true
ignore-docstrings = true
ignore-imports = true
min-similarity-lines = 15

[tool.pytest.ini_options]
addopts = "-p pytester --order-scope=session"
bdd_allow_empty_scenarios = false
bdd_features_base_dir = "features/"
filterwarnings = [
  "error",
  "ignore::DeprecationWarning",
  "ignore::ImportWarning"
]
markers = [
  "deprecated: mark test testing deprecated API",
  "deficient: mark test with non-full coverage",
  "unit: pure in-process module tests",
  "integration: local plugin, parser, runtime, pytester, and subprocess-light flows",
  "contract: golden files, boundary contracts, schema contracts, and formatter parity contracts",
  "e2e: full executable user workflows and feature-doc driven acceptance tests",
  "compat: Python, pytest, dependency, and platform compatibility checks",
  "perf: benchmarks and expensive performance probes",
  "external: Docker, browser, and host-platform harnesses or acceptance wrappers",
  "slow: mark tests that are intentionally excluded from short/default runs",
  "docker: mark tests that require Docker-backed environments",
  "windows: mark tests that require Windows or Windows bridge behavior",
  "posix: mark tests that require POSIX host behavior",
  "browser: mark browser-backed acceptance tests",
  "surplus: mark test testing non-standard API",
  "e2e_retain_technical: mark to prevent auto-removal of e2e test technical scenarios",
  "technical_nonconvertible: mark technical regression tests that must remain in pytest suite",
  "e2e_deferred_conversion: mark test for deferred e2e conversion",
  "e2e_convert_candidate: mark test for e2e conversion candidate",
  "xdist: mark tests that exercise pytest-xdist/distributed execution flows",
  "timeout: per-test timeout from pytest-timeout",
  "order: execution ordering marker from pytest-order"
]
test_group_default = "integration"
test_group_order = ["unit", "integration", "contract", "e2e", "compat", "perf", "external"]
test_group_paths = [
  "src/pytest_bdd_testing/cases/unit/** = unit",
  "src/pytest_bdd_testing/cases/integration/** = integration",
  "src/pytest_bdd_testing/cases/contract/** = contract",
  "src/pytest_bdd_testing/cases/e2e/** = e2e",
  "src/pytest_bdd_testing/cases/compat/** = compat",
  "src/pytest_bdd_testing/cases/perf/** = perf",
  "src/pytest_bdd_testing/cases/external/** = external"
]
testpaths = ["src/pytest_bdd_testing/cases"]

[tool.quality_gates]
command = "uv run pylint src/pytest_bdd/ src/pytest_bdd_testing/cases/unit/"
description = "Enforces project quality gates through the custom Pylint checker plugin"
script = "pytest_bdd._pylint.checkers.quality_gates"

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
  ".eggs",
  ".git",
  ".git-rewrite",
  ".mypy_cache",
  ".ruff_cache",
  ".tox",
  ".venv",
  "__pypackages__",
  "build",
  "dist",
  "venv",
  "scripts"
]
# Same as Black.
line-length = 120
# Assume Python 3.10+
target-version = "py310"

[tool.ruff.format]
# Like Black, indent with spaces, rather than tabs.
indent-style = "space"
# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"
# Like Black, use double quotes for strings.
quote-style = "double"
# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

[tool.ruff.lint]
# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"
# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
ignore = [
  "D203",  # incorrect-blank-line-before-class - Conflicts with active D211 convention
  "D212",  # multi-line - summary-first-line - Conflicts with active D213 convention
  "FIX002",  # line-contains - todo - Legacy/Noisy - ~14 errors
  "TD002",  # missing-todo - author - Legacy/Noisy - ~14 errors
  "TD003",  # missing-todo - link - Legacy/Noisy - ~14 errors
  "E501",  # line-too-long - triggered by generated symbol paths in responsibility docstrings
  "PLR6301"  # no-self-use / method-could-be-function - noisy for pytest hooks
]
preview = true
select = [
  # === Pyflakes / Pycodestyle (core correctness) ===
  "E",  # pycodestyle errors
  "W",  # pycodestyle warnings
  "F",  # Pyflakes
  # === Code Quality ===
  "A",  # flake8-builtins: built-in names shadowed
  "ARG",  # flake8-unused-arguments: unused function arguments
  "B",  # flake8-bugbear: likely bugs and design problems
  "BLE",  # blind-except: blind excepts
  "C4",  # flake8-comprehensions: comprehension optimizations
  "C90",  # flake8-c90: McCabe complexity
  "COM",  # flake8-commas: trailing comma enforcement
  "EM",  # flake8-errmsg: error message consistency
  "ERA",  # eradicate: commented-out code detection
  "FBT",  # flake8-boolean-trap: boolean positional args
  "FIX",  # flake8-fixme: FIXME/TODO comments
  "FLY",  # flynt: f-string modernization
  "FURB",  # refurb: code modernization
  "G",  # flake8-logging-format: logging format
  "ICN",  # flake8-import-conventions: import conventions
  "INT",  # flake8-gettext: gettext usage
  "INP",  # flake8-no-pep420: PEP 420 namespace packages
  "ISC",  # flake8-implicit-str-concat: implicit string concat
  "LOG",  # flake8-logging: logging issues
  "N",  # pep8-naming: naming conventions
  "PERF",  # perflint: performance anti-patterns
  "PGH",  # pygrep-hooks: pre-commit hooks
  "PIE",  # flake8-pie: miscellaneous checks
  "PL",  # pylint: general linting
  "PT",  # flake8-pytest-style: pytest conventions
  "PTH",  # flake8-use-pathlib: pathlib over os.path
  "Q",  # flake8-quotes: string quote consistency
  "RET",  # flake8-return: return statement checks
  "RSE",  # flake8-raise: raise statement checks
  "RUF",  # ruff-specific rules
  "SIM",  # flake8-simplify: code simplification
  "SLF",  # flake8-self: private member access
  "SLOT",  # flake8-slots: slots usage
  "T10",  # flake8-debugger: debugger statements
  "T20",  # flake8-print: print statement usage
  "TRY",  # tryceratops: try/except best practices
  "UP",  # pyupgrade: modernize syntax
  "YTT",  # flake8-2020: outdated version checks
  # === Import Ordering ===
  "I",  # isort: import sorting
  # === Type Annotation ===
  "ANN",  # flake8-annotations: type annotations
  "FA",  # flake8-future-annotations: from __future__ import annotations
  # === Async ===
  "ASYNC",  # flake8-async: asyncio best practices
  # === Date/Time ===
  "DTZ",  # flake8-datetimez: timezone-aware datetimes
  # === Executables ===
  "EXE",  # flake8-executable: shebang enforcement
  # === Type Checking ===
  "TC",  # flake8-type-checking: TYPE_CHECKING guard
  # === TODO Management ===
  "TD",  # flake8-todos: TODO/FIXME management
  "TID",  # flake8-tidy-imports: import restrictions
  # === Security ===
  "S",  # bandit: security issues
  # === pyi Stubs ===
  "PYI"  # flake8-pyi: stub file checks
]
unfixable = []

[tool.ruff.lint.isort]
# Like isort, sort imports using a single line after the import block.
force-single-line = false
# Like isort, separate sections with a blank line.
section-order = [
  "future",
  "standard-library",
  "third-party",
  "first-party",
  "local-folder"
]

[tool.ruff.lint.mccabe]
# Flag errors (`C901`) whenever the complexity level exceeds.
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["ERA001", "F401"]  # ERA001: # init: classification comments; F401: ~2 errors
"docs/conf.py" = ["ERA001"]  # ERA001: ~40 errors (generated docs config)
"docs/tutorial/tests/*" = ["S101"]  # S101: ~2 errors
"scripts/*" = ["ANN", "C901", "D", "DOC201", "DOC501", "E501", "FURB113", "INP001", "PERF401", "PIE810", "PLC0415", "PLR0914", "PLR0915", "PLR2004", "S404", "S603", "SIM101", "SIM108", "SIM110", "TC003", "T201"]  # Project helper scripts are intentionally procedural.
"src/pytest_bdd/_gherkin_go/__init__.py" = ["ARG001", "BLE001", "D205", "DOC201", "DOC501", "E501", "EM101", "PLC0415", "PLW0603", "RUF", "TRY003", "TRY301", "W293"]  # BLE001: blind except in version logging (non-critical); generated responsibility docs exceed style limits; EM101: string literal in ImportError for user-facing install hint; PLC0415: lazy imports for importlib dynamic import pattern; PLW0603: global flag for once-logging; RUF067: __init__.py contains parse() API (not just re-exports); TRY003/TRY301: ImportError with install hint message
"src/pytest_bdd/_gherkin_go/_bridge.py" = ["DOC201", "ANN401"]  # DOC201: internal ctypes helpers; ANN401: ctypes func type cannot be precisely typed
