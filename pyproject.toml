[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools", "wheel"]

[dependency-groups]
dev = [
  "pytest-cov>=7.1.0"
]

[project]
authors = [
  {name = "Oleg Pidsadnyi", email = "oleg.pidsadnyi@gmail.com"},
  {name = "Anatoly Bubenkov", email = "bubenkoff@gmail.com"},
  {name = "Adam Coddington", email = "me@adamcoddington.net"},
  {name = "Albert-Jan Nijburg", email = "albertjan@curit.com"},
  {name = "Alessio Bogon", email = "youtux@gmail.com"},
  {name = "Andrey Makhnach", email = "andrey.makhnach@gmail.com"},
  {name = "Aron Curzon", email = "curzona@gmail.com"},
  {name = "Dmitrijs Milajevs", email = "dimazest@gmail.com"},
  {name = "Dmitry Kolyagin", email = "pauk-slon@users.noreply.github.com"},
  {name = "Florian Bruhin", email = "me@the-compiler.org"},
  {name = "Floris Bruynooghe", email = "flub@devork.be"},
  {name = "Harro van der Klauw", email = "hvdklauw@gmail.com"},
  {name = "Hugo van Kemenade", email = "hugovk@users.noreply.github.com"},
  {name = "Konstantin Goloveshko", email = "kostya.goloveshko@gmail.com"},
  {name = "Laurence Rowe", email = "l@lrowe.co.uk"},
  {name = "Leonardo Santagada", email = "santagada@github.com"},
  {name = "Milosz Sliwinski", email = "sliwinski.milosz@gmail.com"},
  {name = "Michiel Holtkamp", email = "github@elfstone.nl"},
  {name = "Robin Pedersen", email = "ropez@github.com"},
  {name = "Sergey Kraynev", email = "sergejyit@gmail.com"}
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: Pytest",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: MacOS :: MacOS X",
  "Topic :: Software Development :: Testing",
  "Topic :: Software Development :: Libraries",
  "Topic :: Utilities",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14"
]
dependencies = [
  "aiohttp",
  "attrs",
  "certifi",
  "chevron",
  "ci-environment",
  "cucumber-expressions",
  "cucumber-messages",
  "cucumber-tag-expressions",
  "decopatch",
  "filelock",
  "gherkin-official>=33",
  "importlib-metadata;python_version<'3.10.0'",
  "importlib-resources",
  "Jinja2",
  "jsonschema",
  "makefun",
  "ordered_set",
  "packaging",
  "parse",
  "parse_type>=0.6.0",
  "pathvalidate",
  "py",
  "pydantic>=2.0.3",
  "pytest>=7.0.0",
  "returns",
  "ruff",
  "StrEnum;python_version<'3.11.0'",
  "typing-extensions;python_version<'3.11.0'"
]
description = "BDD for pytest"
license = {file = "LICENSE.rst"}
maintainers = [
  {name = "Konstantin Goloveshko", email = "kostya.goloveshko@gmail.com"}
]
name = "pytest-bdd-ng"
readme = {file = "README.rst", content-type = "text/x-rst"}
requires-python = ">=3.10"
version = "2.3.1"

[project.entry-points.pytest11]
"pytest-bdd-code-generator" = "pytest_bdd.plugin.code_generator.entrypoint"
"pytest-bdd-cucumber-formatter-json" = "pytest_bdd.plugin.cucumber_json_formatter.entrypoint:json_plugin"
"pytest-bdd-cucumber-formatter-junit" = "pytest_bdd.plugin.cucumber_junit.entrypoint:junit_plugin"
"pytest-bdd-cucumber-formatter-pretty" = "pytest_bdd.plugin.cucumber_pretty.entrypoint:pretty_plugin"
"pytest-bdd-cucumber-formatter-progress" = "pytest_bdd.plugin.cucumber_progress.entrypoint:progress_plugin"
"pytest-bdd-cucumber-formatter-progress-bar" = "pytest_bdd.plugin.cucumber_progress_bar.entrypoint:progress_bar_plugin"
"pytest-bdd-cucumber-formatter-snippets" = "pytest_bdd.plugin.cucumber_snippets.entrypoint:snippets_plugin"
"pytest-bdd-cucumber-formatter-summary" = "pytest_bdd.plugin.cucumber_summary.entrypoint:summary_plugin"
"pytest-bdd-cucumber-formatter-usage" = "pytest_bdd.plugin.cucumber_usage.entrypoint:usage_plugin"
"pytest-bdd-cucumber-formatter-usage-json" = "pytest_bdd.plugin.cucumber_usage_json.entrypoint:usage_json_plugin"
"pytest-bdd-cucumber-json" = "pytest_bdd.plugin.cucumber_json.entrypoint"
"pytest-bdd-cucumber-json-dispatcher" = "pytest_bdd.plugin.cucumber_json_dispatcher.entrypoint"
"pytest-bdd-gherkin-message-reporter" = "pytest_bdd.plugin.gherkin_message_reporter.entrypoint"
"pytest-bdd-gherkin-scenario-reporter" = "pytest_bdd.plugin.scenario_reporter.entrypoint"
"pytest-bdd-gherkin-terminal-reporter" = "pytest_bdd.plugin.gherkin_terminal_reporter.entrypoint"
"pytest-bdd-scenario-runner" = "pytest_bdd.plugin.pickle_runner.entrypoint"
"pytest-bdd-scenario-test-collector" = "pytest_bdd.plugin.scenario_test_collector.entrypoint"
"pytest-bdd-struct-bdd" = "pytest_bdd.plugin.struct_bdd.entrypoint"

[project.optional-dependencies]
async = [
  "aiofiles"
]
doc-gen = [
  'pandoc',
  'panflute',
  'pypandoc',
  'sphinx>=7.0',
  'myst-parser'
]
full = [
  "pytest-bdd-ng[async]",
  "pytest-bdd-ng[doc-gen]",
  "pytest-bdd-ng[struct-bdd]",
  "pytest-bdd-ng[test]",
  "pytest-bdd-ng[test-playwright]",
  "pytest-bdd-ng[testtypes]"
]
struct-bdd = [
  "hjson",
  "json5",
  "pyhocon",
  'tomli;python_version<"3.11.0"',
  "PyYAML",
  "types-PyYAML"
]
test = [
  "deepdiff",
  "execnet>=2.1.2",
  "GitPython",
  "jq;platform_system!='Windows'",
  "packaging",
  "PyHamcrest",
  "pytest-httpserver",
  "pytest-order",
  "pytest-timeout",
  "pytest-xdist>=3.8.0",
  "python-coveralls",
  "pytest-bdd-ng[struct-bdd]",
  "pytest-bdd-ng[doc-gen];python_version>='3.13.0'"
]
test-playwright = [
  "playwright"
]
testenv = [
  "tox~=4.0",
  "codecov"
]
testtypes = [
  "GitPython",
  "mypy",
  "types-certifi",
  "types-chevron",
  "types-gunicorn",
  "types-jsonschema",
  "types-pexpect",
  "types-Pygments",
  "types-setuptools"
]

[project.scripts]
bdd_tree_to_rst = "pytest_bdd.script.bdd_tree_to_rst:main"
compatibility_matrix = "pytest_bdd.script.compatibility_matrix:main"
render_cucumber_formatters = "pytest_bdd.script.render_cucumber_formatters:main"

[project.urls]
Documentation = "https://pytest-bdd-ng.readthedocs.io/en/default/"
Repository = "https://github.com/elchupanebrej/pytest-bdd-ng"

[tool.mypy]
check_untyped_defs = true
files = "src/pytest_bdd/**/*.py"
install_types = false
plugins = [
  "pydantic.mypy"
]
show_error_codes = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
ignore_missing_imports = true
module = [
  "attr.*",
  "ci_environment.*",
  "cucumber_messages",
  "cucumber_expressions.*",
  "cucumber_tag_expressions.*",
  "decopatch.*",
  "gherkin.*",
  "hjson",
  "json5",
  "makefun",
  "ordered_set",
  "parse",
  "parse_type.*",
  "pluggy.*",
  "_pytest.*",
  "pyhocon",
  "pytest.*",
  "xdist",
  "xdist.*",
  "yaml.*"
]

[[tool.mypy.overrides]]
check_untyped_defs = true
module = [
  "pytest_bdd.model.message_converter",
  "pytest_bdd.model.message_extension",
  "pytest_bdd.model.message_validation",
  "pytest_bdd.plugin.gherkin_message_reporter.*"
]

[tool.pytest.ini_options]
addopts = "-p pytester --order-scope=session"
bdd_allow_empty_scenarios = false
bdd_features_base_dir = "features/"
filterwarnings = [
  "error",
  "ignore::DeprecationWarning",
  "ignore::ImportWarning"
]
markers = [
  "deprecated: mark test testing deprecated API",
  "deficient: mark test with non-full coverage",
  "unit: pure in-process module tests",
  "integration: local plugin, parser, runtime, pytester, and subprocess-light flows",
  "contract: golden files, boundary contracts, schema contracts, and formatter parity contracts",
  "e2e: full executable user workflows and feature-doc driven acceptance tests",
  "compat: Python, pytest, dependency, and platform compatibility checks",
  "perf: benchmarks and expensive performance probes",
  "external: Docker, browser, and host-platform harnesses or acceptance wrappers",
  "slow: mark tests that are intentionally excluded from short/default runs",
  "docker: mark tests that require Docker-backed environments",
  "windows: mark tests that require Windows or Windows bridge behavior",
  "posix: mark tests that require POSIX host behavior",
  "browser: mark browser-backed acceptance tests",
  "surplus: mark test testing non-standard API",
  "technical_nonconvertible: mark technical regression tests that must remain in pytest suite",
  "xdist: mark tests that exercise pytest-xdist/distributed execution flows",
  "timeout: per-test timeout from pytest-timeout",
  "order: execution ordering marker from pytest-order"
]
test_group_default = "integration"
test_group_order = ["unit", "integration", "contract", "e2e", "compat", "perf", "external"]
test_group_paths = [
  "tests/cases/unit/** = unit",
  "tests/cases/integration/** = integration",
  "tests/cases/contract/** = contract",
  "tests/cases/e2e/** = e2e",
  "tests/cases/compat/** = compat",
  "tests/cases/perf/** = perf",
  "tests/cases/external/** = external"
]
testpaths = ["tests/cases"]

[tool.quality_gates]
command = "uv run python -m pytest_bdd._ruff.rules.quality_gates src/pytest_bdd/"
description = "Enforces no return None in non-hook code and logged bare except handlers"
script = "pytest_bdd._ruff.rules.quality_gates"

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
  ".eggs",
  ".git",
  ".git-rewrite",
  ".mypy_cache",
  ".ruff_cache",
  ".tox",
  ".venv",
  "__pypackages__",
  "build",
  "dist",
  "venv"
]
# Same as Black.
line-length = 120
# Assume Python 3.10+
target-version = "py310"

[tool.ruff.format]
# Like Black, indent with spaces, rather than tabs.
indent-style = "space"
# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"
# Like Black, use double quotes for strings.
quote-style = "double"
# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

[tool.ruff.lint]
# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"
# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
ignore = [
  "D203",  # incorrect-blank-line-before-class - Conflicts with active D211 convention
  "D212",  # multi-line - summary-first-line - Conflicts with active D213 convention
  "FIX002",  # line-contains - todo - Legacy/Noisy - ~14 errors
  "TD002",  # missing-todo - author - Legacy/Noisy - ~14 errors
  "TD003"  # missing-todo - link - Legacy/Noisy - ~14 errors
]
preview = true
select = [
  "A",  # flake8-builtins: Built-in names shadowed
  "ANN",  # flake8-annotations: Annotations
  "ARG",  # flake8-unused-arguments: Unused function arguments
  "ASYNC",  # flake8-async: Asyncio
  "B",  # flake8-bugbear: Likely bugs and design problems
  "BLE",  # blind-except: Blind excepts
  "C4",  # flake8-comprehensions: Comprehension optimizations
  "C90",  # flake8-c90: C90 style issues
  "COM",  # flake8-commas: Comma issues
  "D",  # pydocstyle: Docstring conventions
  "DTZ",  # flake8-datetimez: Datetime issues
  "DOC",  # pydoclint: Docstring linting
  "E",  # pycodestyle errors: Style guide enforcement
  "EXE",  # flake8-executable: Executable scripts
  "EM",  # flake8-errmsg: Error message consistency
  "ERA",  # eradicate: Remove commented-out code
  "F",  # Pyflakes: Logical errors, undefined names
  "FA",  # flake8-future-annotations: Future annotations
  "FBT",  # flake8-boolean-trap: Boolean trap
  "FIX",  # flake8-fixme: Fixme comments
  "FLY",  # flynt: String formatting modernization
  "FURB",  # refurb: Code modernization
  "G",  # flake8-logging-format: Logging format issues
  "I",  # isort: Import sorting
  "ICN",  # flake8-import-conventions: Import conventions
  "INT",  # flake8-gettext: Gettext usage
  "INP",  # flake8-no-pep420: PEP 420 namespace packages
  "ISC",  # flake8-implicit-str-concat: Implicit string concatenation
  "LOG",  # flake8-logging: Logging issues
  "N",  # pep8-naming: Naming conventions
  "PERF",  # perflint: Performance issues
  "PGH",  # pygrep-hooks: Pre-commit hooks
  "PIE",  # flake8-pie: Miscellaneous checks
  "PL",  # pylint: Linting
  "PT",  # flake8-pytest-style: Pytest style
  "PTH",  # flake8-use-pathlib: Use pathlib
  "PYI",  # flake8-pyi: Pyi file checks
  "RET",  # flake8-return: Return statement checks
  "RSE",  # flake8-raise: Raise statement checks
  "RUF",  # ruff: Ruff-specific checks
  "S",  # bandit: Security issues
  "SIM",  # flake8-simplify: Simplifiable code
  "SLF",  # flake8-self: Private member access
  "SLOT",  # flake8-slots: Slots usage
  "T10",  # flake8-debugger: Debugger usage
  "T20",  # flake8-print: Print statement usage
  "TC",  # flake8-type-checking: Type checking
  "TD",  # flake8-todos: TODO comments
  "TID",  # flake8-tidy-imports: Import restrictions
  "TRY",  # tryceratops: Try/except issues
  "YTT",  # flake8-2020: Outdated sys.version checks
  "W",  # pycodestyle warnings: Style guide warnings
  "UP",  # pyupgrade: Modernize syntax for newer Python versions
  "Q"  # flake8-quotes: String quote consistency
]
unfixable = []

[tool.ruff.lint.isort]
# Like isort, sort imports using a single line after the import block.
force-single-line = false
# Like isort, separate sections with a blank line.
section-order = [
  "future",
  "standard-library",
  "third-party",
  "first-party",
  "local-folder"
]

[tool.ruff.lint.mccabe]
# Flag errors (`C901`) whenever the complexity level exceeds.
max-complexity = 10  # TODO target is 6

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # F401: ~2 errors
"docs/conf.py" = ["ERA001"]  # ERA001: ~40 errors (generated docs config)
"docs/tutorial/tests/*" = ["S101"]  # S101: ~2 errors
"src/pytest_bdd/_gherkin_go/__init__.py" = ["BLE001", "DOC201", "PLW0603", "RUF"]  # BLE001: blind except in version logging (non-critical); DOC201: internal functions; PLW0603: global flag for once-logging; RUF067: __init__.py contains parse() API (not just re-exports)
"src/pytest_bdd/_gherkin_go/_bridge.py" = ["DOC201", "ANN401"]  # DOC201: internal ctypes helpers; ANN401: ctypes func type cannot be precisely typed
"src/pytest_bdd/_gherkin_go/_build.py" = ["PLR6301", "S404", "S603", "S607"]  # PLR6301: setuptools Command.run override; S404/S603/S607: subprocess for go build is intentional
"src/pytest_bdd/_gherkin_go/_types.py" = ["N818"]  # N818: GherkinGoNotAvailable is a domain-specific name, not a naming error
"src/pytest_bdd/collector_batch.py" = ["DOC201", "DOC501", "PLC0415", "PLR6201", "SIM103"]  # DOC201/DOC501: internal functions; PLC0415: lazy imports for multiprocessing; PLR6201: tuple is fine for 2 items; SIM103: readability preferred
"src/pytest_bdd/compatibility/pytest/__init__.py" = ["RUF"]  # RUF067 preview rule not recognized by pre-commit ruff v0.12.0
"src/pytest_bdd/script/message_capability_governance/*" = ["PLC0415", "SLF001", "TC003"]  # PLC0415: lazy imports for monkeypatch compatibility; SLF001: package-internal _repo_root/_candidate_repo_roots access for monkeypatching; TC003: Path used at runtime in function bodies
"tests/cases/*" = ["ANN", "D", "DOC201", "EM101", "F841", "INP001", "PLC0415", "PLC2701", "PLR0913", "PLR0914", "PLR0915", "PLR0917", "PLR2004", "PLR6301", "S101", "S506", "SIM117", "SLF001"]  # ANN: ~885 errors, D: ~908 errors, EM101: ~4 errors, PLR0913: ~6 errors, PLR0914: ~3 errors, PLR0915: ~3 errors, PLR0917: ~2 errors, PLR2004: ~43 errors, S101: ~1582 errors, S506: ~9 errors
"tests/cases/external/e2e/test_xdist_remote_message_aggregation.py" = ["S603"]  # S603 version mismatch between ruff 0.12 and 0.15
"tests/cases/integration/struct_bdd/test_steps.py" = ["E501"]  # E501: raw JSON strings exceed line length

[tool.ruff.lint.pyupgrade]
# Preserve types, even if a file imports `from __future__ import annotations`.
keep-runtime-typing = true

[tool.setuptools]
include-package-data = true
package-dir = {"" = "src"}

[tool.setuptools.cmdclass]
build_go = "pytest_bdd._gherkin_go._build.BuildGoCommand"

[tool.setuptools.package-data]
pytest_bdd = [
  "markdown_parser.js"
]
"pytest_bdd._gherkin_go" = [
  "*.so",
  "*.dll",
  "*.dylib"
]
"pytest_bdd.model" = [
  "message_jsonschema/*.json"
]
"pytest_bdd.plugin.gherkin_message_reporter.resources.templates" = [
  "live_formatter_bridge.mjs.j2",
  "formatter_adapter_support.cjs.j2"
]
"pytest_bdd.plugin.gherkin_message_reporter.resources.templates.formatters" = [
  "pretty.cjs.j2",
  "progress.cjs.j2",
  "progress_bar.cjs.j2",
  "usage.cjs.j2",
  "junit.cjs.j2"
]
"pytest_bdd.template" = [
  "feature_include.rst.jinja2",
  "features_index.rst.jinja2",
  "features_section.rst.jinja2",
  "test.py.jinja2"
]

[tool.setuptools.packages.find]
namespaces = false
where = [
  "src"
]
