schema_version: 1
project:
  python_requirement: ">=3.11"
  pytest_requirement: ">=7.0"
  tox_config: tox.ini
  workflow: .github/workflows/main.yml
  tox_listing_command: [tox, list, --no-desc]
  tox_selector_fragments: [pytest70, pytest71, pytest72, pytest73, pytest80, pytest81, pytest82, pytest83, allure]
  fast_pr:
    runner: ubuntu-latest
    runtime: CPython
    python: "3.13"
    command: "python -m pytest -m 'not e2e and not external and not slow and not typecheck and not doc_gen' -q"
    marker: "not e2e and not external and not slow and not typecheck and not doc_gen"
    rationale: "Fast feedback only; it is not a full-matrix acceptance result."
  evidence:
    command: "tox run --result-json tox-result.json -e <environment>"
    fields: [git_sha, tox_environment, runtime, python, pytest, platform, architecture, optional_versions, system_tool_versions, system_tool_commands, remote_worker_runs, command, selected_tests, passed_tests, outcome, job_url, run_url]
    aggregate_groups: [serial, parallel, e2e, external, quality, optional]

runtime_policy:
  schema_version: 1
  python_requirement: ">=3.11"
  pytest: {minimum: ">=7.0", latest: "9.x"}
  evidence_fields: &runtime_evidence_fields [python, pytest, platform, architecture, git_sha, command, selected_tests, passed_tests, outcome, job_url, run_url]
  upstream_sources:
    cpython: &cpython_source {status: available, source_evidence: [https://www.python.org/downloads/]}
    pypy: &pypy_source {status: available, source_evidence: [https://www.pypy.org/download.html]}
    graalpy: &graalpy_source {status: available, source_evidence: [https://www.graalvm.org/python/]}
  installability: &core_installability {status: required-acceptance, acceptance: [core-install, core-tests, examples]}
  product_support: &product_supported {status: supported}
  required_cells:
