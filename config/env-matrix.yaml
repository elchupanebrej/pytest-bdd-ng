      runtime: CPython
      python: "3.11"
      platform: linux
      architecture: x86_64
      setup_python: {input: "3.11", expected_interpreter: "3.11.*"}
      upstream_availability: *cpython_source
      installability: *core_installability
      product_support: *product_supported
      required_ci: {status: required, workflow_cell: cpython-311-linux, tox_envs: [py311-pytestlatest-coverage-lin, py311-pytest74-coverage-lin]}
      required_pytest_lines: ["9.x", "7.4.x"]
