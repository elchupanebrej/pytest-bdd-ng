schema_version: 1
project:
  python_requirement: ">=3.10"
  pytest_requirement: ">=7.0"
  tox_config: tox.ini
  workflow: .github/workflows/main.yml
  tox_listing_command: [tox, list, --no-desc]
  fast_pr:
    runner: ubuntu-latest
    runtime: CPython
    python: "3.13"
    command: "python -m pytest -m 'not e2e and not external and not slow and not typecheck and not doc_gen' -q"
    marker: "not e2e and not external and not slow and not typecheck and not doc_gen"
    rationale: "Fast feedback only; it is not a full-matrix acceptance result."
  evidence:
    command: "tox run --result-json tox-result.json -e <environment>"
    fields: [git_sha, tox_environment, runtime, python, pytest, optional_versions, system_tool_versions, system_tool_commands, remote_worker_runs, command, selected_tests, passed_tests, outcome]
    aggregate_groups: [serial, parallel, e2e, external, quality]

