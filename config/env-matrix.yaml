schema_version: 1
project:
  python_requirement: ">=3.10"
  pytest_requirement: ">=7.0"
  tox_config: tox.ini
  workflow: .github/workflows/main.yml
  tox_listing_command: [tox, list, --no-desc]
  fast_pr:
    runner: ubuntu-latest
    runtime: CPython
    python: "3.13"
    command: "python -m pytest -m 'not e2e and not external and not slow and not typecheck' -q"
    marker: "not e2e and not external and not slow and not typecheck"
    rationale: "Fast feedback only; it is not a full-matrix acceptance result."
  evidence:
    command: "tox run --result-json tox-result.json -e <environment>"
    fields: [git_sha, tox_environment, runtime, python, pytest, optional_versions, command, selected_tests, passed_tests, outcome]
    aggregate_groups: [serial, parallel, e2e, external, quality]

# The twelve frozen #149 cells are retained. Three PyPy 3.10 cells preserve
# the green current-branch baseline from #200 while PyPy 3.11 is added.
workflow_cells:
  - id: cpython-310-linux
    job: full-matrix
    runtime: CPython
    python: "3.10"
    platform: linux
    runner: ubuntu-latest
    tox_envs: [py310-pytest70-coverage-lin, py310-pytest71-coverage-lin, py310-pytestlatest-coverage-lin, py310-pytestlatest-xdist-coverage-lin]
